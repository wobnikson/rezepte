const SHOP_PAR=/\s*\((am besten[^)]*|optional|nach Geschmack|nach Belieben|bei Bedarf|zur Deko|zum Garnieren|Gr\.[^)]*|groß|klein|für [^)]*|\+ [^)]*|Zimmertemperatur|oder etwas weniger)\)/gi;
const SHOP_TAIL=/\s+(zur Deko|zum Garnieren|zum Anrichten|zum Binden|zum Braten|zum Anbraten|zum Backen|für die (Form|Arbeitsfläche)|etc\.?)$/i;
const SHOP_BITS=/^(frisch|fein|grob|gehackt|gewürfelt|gerieben|zum .*|zur .*|nach .*|für .*|optional|bei Bedarf|alternativ.*|etc\.?)$/i;
function shopPrep(name,u,v,a){
  name=String(name).replace(/^[⅓⅔¼½¾]\s*/,'').replace(/^(evtl\.|ggf\.|etwas)\s+/i,'').replace(SHOP_PAR,'').replace(/,\s*(frisch|zerbröselt|zerkleinert|abgetropft|gewaschen|geschält|entsteint)$/i,'').trim();
  for(let i=0;i<3;i++) name=name.replace(SHOP_TAIL,'').replace(SHOP_ADJ,'').trim();
  if(!name || SHOP_BITS.test(name)) return {name:'',u,v,a};          // Bruchstücke wie „frisch“, „zum Anrichten“
  if(/^knoblauchzehen?$/i.test(name)) return {name:'Knoblauch',u:'',v:null,a:''};   // kauft man als Knolle
  if(/^salatblätter?$/i.test(name)) return {name:'Salat',u:'',v:null,a:''};
  if(/^scheiben? /i.test(name)) return {name:name.replace(/^scheiben? /i,''),u:'',v:null,a:''};   // „2 Scheiben Brot“ → Brot
  if(/^(eigelb|eiweiß|eiklar)\b/i.test(name)) name='Ei';               // dafür braucht man Eier
  if(NO_AMT_U.has(u) || autoSec({name:name,u:u})==='Gewürze, Öl & Saucen') return {name,u:'',v:null,a:''};
  return {name,u,v,a};
}
function fmtAmt(v,u){
  // Stückzahlen und Packungen kauft man ganz: ½ Gurke → 1 Gurke, ½ Pck. → 1 Pck.
  if(v!=null && (!u || ['Pck.','Bund','Glas','Dose','Dosen'].includes(u))) v=Math.max(1,Math.ceil(v-1e-9));
  if(u==='g' && v>=1000) return String(Math.round(v/100)/10).replace('.',',')+' kg';
  if(u==='ml' && v>=1000) return String(Math.round(v/100)/10).replace('.',',')+' l';
  return num(v,u)+(u?' '+uPl(u,v):'');
}
function sumText(it){
  if(it.parts.some(p=>p.a)) return it.parts.map(p=>p.a||(p.n!=null?fmtAmt(p.n,it.u):'')).filter(Boolean).join(' + ');
  if(it.parts.every(p=>p.n==null)) return '';
  return fmtAmt(it.parts.reduce((a,p)=>a+p.n,0),it.u);
}
// Anzeigename: bei mehr als einem Stück die Mehrzahl, sonst die Einzahl, wenn vorhanden
function dispName(it){
  const names=[...new Set([it.name,...it.parts.map(p=>p.nm).filter(Boolean)])];
  if(names.length<2) return it.name;
  const total=it.parts.every(p=>p.n!=null)?it.parts.reduce((a,p)=>a+p.n,0):2;
  const plural=names.filter(n=>{ const l=n.toLowerCase().replace(SIZE_WORDS,' ').replace(/\s+/g,' ').trim(); return l!==canon(n); });
  const single=names.filter(n=>!plural.includes(n));
  return (total>1 ? plural[0]||names[0] : single[0]||names[0]).replace(SIZE_WORDS,'').replace(/\s+/g,' ').trim();
}
// Einfache Mehrzahl für Stückzahlen (Karotte → Karotten, Zwiebel → Zwiebeln, Ei → Eier)
function pluralize(name){
  return name.replace(/(\S+)(\s*\(.*\))?$/,(all,w,rest)=>{
    rest=rest||''; const l=w.toLowerCase();
    if(l==='ei') return w+'er'+rest;
    if(/(e|el|er)$/.test(l) && canon(w)===l) return w+'n'+rest;
    return all; });
}
function shownName(it){
  let n=dispName(it);
  const tot=it.parts.every(p=>p.n!=null)?it.parts.reduce((a,p)=>a+p.n,0):0;
  if(!it.u && tot>1 && it.parts.length>1) n=pluralize(n);
  return n;
}
function itemText(it){ if(it.text!=null) return it.text; const a=sumText(it); return (a?a+' ':'')+shownName(it); }
function addPart(name,u0,n0,a,r){
  const [u,n]=normUnit(u0,n0);
  const key=canon(name)+'|'+u;
  const plainAmt = n==null && !a;
  const noAmt=i=>i.parts.every(p=>p.n==null && !p.a);
  let hit=shop.items.find(i=>!i.done && i.text==null && (canon(i.name)+'|'+i.u)===key &&
    (n!=null ? i.parts.every(p=>p.n!=null) : plainAmt && noAmt(i)));
  // Zutat ohne Menge zu einem Eintrag mit Menge (oder umgekehrt): ein Eintrag reicht
  if(!hit) hit=shop.items.find(i=>!i.done && i.text==null && canon(i.name)===canon(name) && (plainAmt || noAmt(i)) && !(n!=null && i.parts.some(p=>p.a)));
  if(hit && noAmt(hit) && !plainAmt) hit.u=u;
  const part={rid:r.id,rt:r.title,n:n,a:a,nm:name};
  if(hit){ hit.parts.push(part); return hit; }
  const it={id:newId(),t:stamp(),name:name,u:u,parts:[part],done:false}; shop.items.push(it); return it;
}
function addRecipe(r,f,sel){
  let k=0,n=0; const changed=new Set();
  r.groups.forEach(g=>g.items.forEach(it=>{
    const idx=k++; if(!sel.has(idx)) return;
    const names = it.m==null ? it.t.split(',').map(s=>s.trim()) : [baseName(it.t)];
    names.forEach(name=>{
      name=name.replace(/\s*\((\d+ )?(kleine |große )?Dose[^)]*\)/i,'').trim();
      if(isBasic(name)) return;
      let u=it.u||'', v=null, a='';
      if(it.m!=null){ if(Array.isArray(it.m)) a=qty(it,f).replace(/^ca\. /,''); else v=it.m*f; }
      const x=shopPrep(name,u,v,a); if(!x.name || isBasic(x.name)) return;
      changed.add(addPart(x.name,x.u,x.v,x.a,r)); n++;
    });
  }));
  if(n) commit([...changed],[]);
  return n;
}

  if(act==='startshare'){ connect(randomListId(),true); toast('Gemeinsame Liste angelegt. Schick jetzt den Link an andere.'); }
  else if(act==='leave'){ disconnect(); toast('Getrennt. Die Liste bleibt auf diesem Gerät, wird aber nicht mehr abgeglichen.'); }
  else if(act==='toggle'&&it){ it.done=!it.done; commit([it],[]); }

  else if(act==='del'&&it){ editId=null; delItem(it); return; }

    shop.items.forEach(i=>{ if(i.parts.some(p=>p.rid===rid)){ i.parts=i.parts.filter(p=>p.rid!==rid); (i.parts.length||i.custom?ch:rm).push(i); } });

  else if(act==='cleardone'){ const rm=shop.items.filter(i=>i.done); shop.items=shop.items.filter(i=>!i.done); commit([],rm); }

const PK='rz-plan-v1';

let planPor=null;                        // geplante Portionen beim Öffnen eines Rezepts aus dem Plan
const DN=['Mo','Di','Mi','Do','Fr','Sa','So'], DL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dOf=ds=>new Date(ds+'T00:00');
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const today0=()=>{ const t=new Date(); t.setHours(0,0,0,0); return t; };

function kwOf(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
let wkStart=today0();   // Plan zeigt immer ab heute die nächsten 7 Tage

function planPlain(e){ const o={kind:'plan',date:e.date,t:e.t||stamp()}; if(e.rid){ o.rid=e.rid; o.rt=e.rt; o.por=e.por; o.bought=!!e.bought; o.cooked=!!e.cooked; } else o.text=e.text; return o; }
function commitPlan(changed,removed){
  savePlan();
  if(listId && db){ const c=col(), b=db.batch();
    (changed||[]).forEach(e=>b.set(c.doc(e.id),planPlain(e)));
    (removed||[]).forEach(e=>b.delete(c.doc(e.id)));

}

const unitShort=r=>(r&&r.unit||'Port.').replace('Portionen','Port.').replace('Personen','Pers.');

function openWeekShop(){
  const td=isoD(today0()), a=isoD(wkStart)<td?td:isoD(wkStart), z=isoD(addD(wkStart,6));
  wEntries=plan.filter(e=>e.rid&&!e.bought&&!e.cooked&&e.date>=a&&e.date<=z&&recOf(e));
  const map=new Map();
  wEntries.forEach(e=>{ const r=recOf(e), f=r.servings?e.por/r.servings:e.por, dn=DN[(dOf(e.date).getDay()+6)%7];
    r.groups.forEach(g=>g.items.forEach(it=>{
      const names = it.m==null ? it.t.split(',').map(x=>x.trim()) : [baseName(it.t)];
      names.forEach(name=>{
        name=name.replace(/\s*\((\d+ )?(kleine |große )?Dose[^)]*\)/i,'').trim(); if(isBasic(name)) return;
        let v=null,aTxt=''; if(it.m!=null){ if(Array.isArray(it.m)) aTxt=qty(it,f).replace(/^ca\. /,''); else v=it.m*f; }
        const x=shopPrep(name,it.u||'',v,aTxt); if(!x.name || isBasic(x.name)) return; name=x.name; v=x.v; aTxt=x.a;
        const [u,nv]=normUnit(x.u,v), key=canon(name)+'|'+u+(aTxt||v==null?'|x':'');
        const row=map.get(key)||{name,u,sum:0,has:false,a:[],days:new Set(),parts:[]};
        if(nv!=null){ row.sum+=nv; row.has=true; } if(aTxt) row.a.push(aTxt);
        row.days.add(dn); row.parts.push({r,name,u:x.u,v,a:aTxt}); map.set(key,row);
      });
    }));
  });
  wRows=[...map.values()];

  wRows.filter(x=>!x.has&&!x.a.length).forEach(x=>{ const t=wRows.find(y=>y!==x&&!y.dead&&(y.has||y.a.length)&&canon(y.name)===canon(x.name)); if(t){ t.parts.push(...x.parts); x.days.forEach(d=>t.days.add(d)); x.dead=true; } });
  wRows=wRows.filter(x=>!x.dead); wSel=new Set();
  const txt=x=>x.a.length?x.a.join(' + ')+' ':(x.has?fmtAmt(x.sum,x.u)+' ':'');

    '<div style="margin:6px 0;flex:none"><button class="linkbtn" type="button" data-wsel="all">Alle</button> · <button class="linkbtn" type="button" data-wsel="none">Keine</button></div>'+
    '<div class="sh-body"><ul class="ing picking">'+wRows.map((x,i)=>'<li><label for="w'+i+'"><input type="checkbox" id="w'+i+'" data-wi="'+i+'"><span><span class="q">'+esc(txt(x))+'</span>'+esc(x.parts.length>1&&!x.u&&x.has&&x.sum>1?pluralize(x.name):x.name)+'</span></label></li>').join('')+'</ul></div>'+
    '<div class="sbar"><button class="btn primary" type="button" id="wAdd" disabled>Zutaten auswählen</button></div>','wshop');
}

  closeSheet(); connect(id,true); renderShop(); toast('Mit der gemeinsamen Liste verbunden.'); });
$('#bs').addEventListener('change',e=>{ const c=e.target; if(!c.matches('[data-wi]')) return; c.checked?wSel.add(+c.dataset.wi):wSel.delete(+c.dataset.wi); updW(); });
$('#bs').addEventListener('keydown',e=>{ if(e.target.id==='noteIn'&&e.key==='Enter'){ e.preventDefault(); $('#noteAdd').click(); } });
cleanPlan();

/* ---------- Timer ---------- */
let timers=[]; try{ timers=JSON.parse(localStorage.getItem('rz-timer')||'[]'); }catch(e){}
let actx=null, tick=null, lastBeep=0;
function saveTimers(){ try{ localStorage.setItem('rz-timer',JSON.stringify(timers)); }catch(e){} }
function fmtT(ms){ const s=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); }
function timerOf(rid,si,ti){ return timers.find(t=>t.rid===rid && t.si===si && t.ti===ti); }
function tapTimerChip(tb,r){
  const si=+tb.dataset.si, ti=+tb.dataset.ti, run=timerOf(r.id,si,ti);
  if(run){ toast(run.end>Date.now()?'Läuft noch '+fmtT(run.end-Date.now())+'.':'Zeit ist um.',null,'Timer stoppen',()=>{ timers=timers.filter(x=>x!==run); saveTimers(); tSig=null; renderTimers(); }); return; }
  startTimer(+tb.dataset.sec, r, si, ti, +tb.dataset.hi||0);
}
function startTimer(sec,r,si,ti,hi){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}   // Ton freischalten (braucht einen Tipp)
  timers.push({id:newId(),end:Date.now()+sec*1000,label:'Schritt '+(si+1)+' · '+r.title.replace(/ (mit|und|in|an|auf) .*/,''),sec:sec,rid:r.id,si:si,ti:ti,hi:hi||0,start:Date.now()});
  saveTimers(); tSig=null; renderTimers();
  if(!wakeOn) toggleWake(true);
}
function beep(){ if(!actx) return; try{ const t=actx.currentTime;
  [0,.25,.5].forEach(d=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,t+d); g.gain.exponentialRampToValueAtTime(.4,t+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d+.2); o.start(t+d); o.stop(t+d+.22); }); }catch(e){} }
let tSig='';
function renderTimers(){
  const now=Date.now();
  // Nur neu aufbauen, wenn sich Timer oder ihr Zustand ändern; sonst nur die Zeit aktualisieren (Knöpfe bleiben antippbar)
  const sig=timers.map(t=>t.id+(t.end<=now?'!':'')).join(',');
  if(sig!==tSig){ tSig=sig;
    $('#tbar').innerHTML=timers.map(t=>{ const ring=t.end<=now;
      const r=R.find(x=>x.id===t.rid), nm=r?shortT(r.title):String(t.label||'').replace(/^Schritt \d+ · /,'');
      return '<div class="tm'+(ring?' ring':'')+'" data-id="'+t.id+'"><button type="button" class="tm-go" data-t="go" aria-label="Zu Schritt '+(t.si+1)+': '+esc(nm)+'">'+
        '<span class="tm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.2 1.6M10 2.5h4"/></svg></span>'+
        '<span class="tm-txt"><b>'+esc(nm)+'</b><small>Schritt '+(t.si+1)+(ring?' · Zeit ist um':'')+'</small></span></button><span class="tt"></span>'+
        (ring?'':'<button type="button" class="tm-b" data-t="plus" aria-label="1 Minute dazu">+1</button>')+'<button type="button" class="tm-b" data-t="stop" aria-label="Timer beenden">'+(ring?'OK':'✕')+'</button></div>'; }).join('');
  }
  timers.forEach(t=>{ const el=document.querySelector('.tm[data-id="'+t.id+'"] .tt'); if(el) el.textContent = t.end<=now ? '0:00' : fmtT(t.end-now); });
  // 2: Countdown direkt in der Zeitangabe
  const live=new Set();
  timers.forEach(t=>document.querySelectorAll('.tbtn[data-rid="'+t.rid+'"][data-si="'+t.si+'"][data-ti="'+t.ti+'"]').forEach(b=>{
    live.add(b); b.classList.add('running'); b.classList.toggle('over',t.end<=now); b.textContent = t.end<=now ? 'Zeit ist um' : fmtT(t.end-now); }));
  document.querySelectorAll('.tbtn.running').forEach(b=>{ if(!live.has(b)){ b.classList.remove('running','over'); b.textContent=b.dataset.orig; } });
  // 6: großer Ring im Kochmodus für den aktuellen Schritt
  const inCook = !$('#cook').hidden && ck, ct = inCook ? timers.find(t=>t.rid===ck.rid && t.si===cookI) : null, box=$('#ckTimer');
  document.querySelectorAll('.tm').forEach(el=>{ el.classList.toggle('inring', !!ct && el.dataset.id===ct.id);
    const t=timers.find(x=>x.id===el.dataset.id); el.classList.toggle('insess', !inCook && !!t && !!sesOf(t.rid) && t.end>now); });
  updateCookTimes();
  if(box){
    if(!ct){ if(box.dataset.id){ box.innerHTML=''; box.dataset.id=''; } }
    else {
      if(box.dataset.id!==ct.id){ box.dataset.id=ct.id;
        box.innerHTML='<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="rbg"/><circle cx="60" cy="60" r="52" class="rfg"/></svg><div class="rt"></div></div>'+
          '<div class="rbtns"><button class="btn" type="button" data-ct="plus" data-id="'+ct.id+'">+1 Minute</button><button class="btn" type="button" data-ct="stop" data-id="'+ct.id+'">Stoppen</button></div>';
        requestAnimationFrame(()=>{ try{ box.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){} }); }
      const left=Math.max(0,ct.end-now), tot=Math.max(1,ct.end-(ct.start||ct.end-ct.sec*1000)), c=2*Math.PI*52;
      box.querySelector('.rt').textContent = left ? fmtT(left) : '0:00';
      const fg=box.querySelector('.rfg'); fg.style.strokeDasharray=c; fg.style.strokeDashoffset=c*(1-left/tot);
      box.classList.toggle('over',!left);
    }
  }
  // 4: deutliche Meldung, wenn die Zeit um ist
  const ringing=timers.find(t=>t.end<=now), dlg=$('#tdone');
  if(ringing && dlg.dataset.id!==ringing.id){ dlg.dataset.id=ringing.id;
    const r=R.find(x=>x.id===ringing.rid), more=ringing.hi>ringing.sec ? Math.round((ringing.hi-ringing.sec)/60) : 0;
    const stxt = r && r.steps[ringing.si] ? r.steps[ringing.si] : '';
    dlg.innerHTML='<div class="td-card" role="alertdialog" aria-labelledby="tdh"><div class="td-ico">⏱</div><h2 id="tdh">Zeit ist um!</h2>'+
      '<p class="td-lbl">'+esc(ringing.label)+'</p>'+(stxt?'<p class="td-step">'+esc(stxt.length>140?stxt.slice(0,140)+' …':stxt)+'</p>':'')+
      (more?'<button class="btn primary" type="button" data-td="more" data-add="'+(ringing.hi-ringing.sec)+'">Noch '+(more>=1?more+' Minute'+(more>1?'n':''):(ringing.hi-ringing.sec)+' Sekunden')+'</button>':'')+
      '<div class="td-row"><button class="btn" type="button" data-td="plus">+1 Minute</button><button class="btn'+(more?'':' primary')+'" type="button" data-td="ok">'+(more?'Fertig':'OK')+'</button></div>'+
      (sesOf(ringing.rid) && !(ck && ck.rid===ringing.rid && cookI===ringing.si)?'<button class="btn quiet" type="button" data-td="go">Zu Schritt '+(ringing.si+1)+' ›</button>':'')+'</div>';
    dlg.hidden=false;
  }
  document.body.classList.toggle('tdopen', !!ringing);
  if(!ringing && !dlg.hidden){ dlg.hidden=true; dlg.dataset.id=''; }
  if(timers.some(t=>t.end<=now) && now-lastBeep>1400){ lastBeep=now; beep(); try{ navigator.vibrate&&navigator.vibrate([300,150,300]); }catch(e){} }
  const tbH = timers.length ? $('#tbar').offsetHeight+8 : 0;
  document.body.style.setProperty('--tb', tbH+'px'); document.body.classList.toggle('timing', !!timers.length);
  if(timers.length && !tick) tick=setInterval(renderTimers,500);
  if(!timers.length && tick){ clearInterval(tick); tick=null; }
}
$('#tdone').addEventListener('click',e=>{
  const b=e.target.closest('[data-td]'); if(!b) return; const t=timers.find(x=>x.id===$('#tdone').dataset.id);
  $('#tdone').dataset.id=''; $('#tdone').hidden=true;
  if(t){ if(b.dataset.td==='plus'){ t.end=Date.now()+60000; t.start=Date.now(); t.sec=60; t.hi=0; }
    else if(b.dataset.td==='more'){ const add=+b.dataset.add; t.end=Date.now()+add*1000; t.start=Date.now(); t.sec=add; t.hi=0; }
    else timers=timers.filter(x=>x!==t); }
  saveTimers(); tSig=null; renderTimers();
  if(b.dataset.td==='go' && t){ const x=sesOf(t.rid); if(x){ if(!$('#cook').hidden && ck!==x){ ck=null; } openSession(x,t.si); } }
});
$('#tbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-t]'); if(!b) return; const id=b.closest('.tm').dataset.id, t=timers.find(x=>x.id===id); if(!t) return;
  if(b.dataset.t==='go'){ const x=sesOf(t.rid); if(x) openSession(x,t.si); else if(location.hash!=='#'+t.rid) location.hash=t.rid; return; }
  if(b.dataset.t==='plus') t.end+=60000; else timers=timers.filter(x=>x!==t);
  saveTimers(); renderTimers();
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') renderTimers(); });

let toastT=null;
let toastFn=null;
function toast(msg,link,linkText,fn){
  const t=$('#toast'); toastFn=fn||null;
  t.innerHTML='<span>'+esc(msg)+'</span>'+(fn?'<button type="button" class="tact">'+esc(linkText||'Rückgängig')+'</button>':link?'<a href="'+link+'">'+(linkText||'Zur Liste')+'</a>':''); t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; toastFn=null; },fn?5000:3500);
}
$('#toast').addEventListener('click',e=>{ if(e.target.closest('.tact') && toastFn){ const f=toastFn; toastFn=null; $('#toast').hidden=true; f(); return; } if(e.target.closest('a')) $('#toast').hidden=true; });

/* ---------- Navigation ---------- */
// Merkt sich den Weg innerhalb der App, damit „Zurück“ nie aus der App hinausführt
const trail=[location.hash];
function goBack(){ if(trail.length>1) history.back(); else location.hash=''; }
function updateNav(){
  const v = !$('#shop').hidden ? 'einkauf' : !$('#week').hidden ? 'woche' : (!$('#home').hidden && cat===FAV ? 'favoriten' : 'rezepte');
  document.querySelectorAll('.bnav button').forEach(b=>{ if(b.dataset.nav===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
}
document.querySelector('.bnav').addEventListener('click',e=>{
  const b=e.target.closest('[data-nav]'); if(!b) return; const v=b.dataset.nav;
  if(!$('#cook').hidden) minimizeCook(true);
  if(v==='einkauf'){ if(location.hash!=='#einkauf') location.hash='einkauf'; return; }
  if(v==='woche'){ if(location.hash!=='#woche') location.hash='woche'; else { wkStart=today0(); renderWeek(); window.scrollTo(0,0); } return; }
  const want = v==='favoriten' ? FAV : (cat===FAV ? 'Alle' : cat);
  const onHome = !location.hash || location.hash==='#';
  if(want!==cat || v==='rezepte') setCat(want);
  if(onHome){ route(); window.scrollTo(0,0); } else location.hash='';
});
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  $('#toast').hidden=true;
  if(!$('#cook').hidden) minimizeCook(true);
  closeSheet();
  const r=R.find(x=>x.id===id);
  $('#home').hidden=$('#detail').hidden=$('#shop').hidden=$('#week').hidden=true;
  if(id==='einkauf'){ cur=null; editId=null; confirmClear=false; shareFallback=''; renderShop(); $('#shop').hidden=false; window.scrollTo(0,0); }
  else if(id==='woche'){ cur=null; renderWeek(); $('#week').hidden=false; window.scrollTo(0,0); }
  else if(r){ renderDetail(r); $('#detail').hidden=false; window.scrollTo(0,0); }
  else { cur=null; renderTabs(); renderList(); renderToday(); $('#home').hidden=false; }
  document.body.classList.toggle('hasact',!$('#detail').hidden);
  if($('#detail').hidden) document.body.classList.remove('picking');
  stickBar(); updateCartCount(); updateNav(); renderCookBar();
}
let lastY=0;
function stickBar(){ const b=$('#detail .bar'); if(b && !$('#detail').hidden) b.classList.toggle('stuck',window.scrollY>60);
  const y=window.scrollY, nearEnd=y+innerHeight>=document.documentElement.scrollHeight-40;
  if($('#detail').hidden || y<80 || nearEnd) document.body.classList.remove('actoff');
  else if(y>lastY+6) document.body.classList.add('actoff');
  else if(y<lastY-6) document.body.classList.remove('actoff');
  lastY=y; }
window.addEventListener('scroll',stickBar,{passive:true});
window.addEventListener('hashchange',()=>{
  const h=location.hash;
  if(trail.length>1 && trail[trail.length-2]===h) trail.pop(); else trail.push(h);
  if(!h || h==='#') trail.length=1, trail[0]=h;
  route();
});
window.addEventListener('storage',e=>{ if(e.key===PK && !listId){ try{ plan=JSON.parse(e.newValue)||plan; }catch(_){} if(!$('#week').hidden) renderWeek(); }
  if(e.key===SK && !listId){ try{ shop=JSON.parse(e.newValue)||shop; }catch(_){} route(); } });
renderTabs(); renderList(); route(); renderTimers(); cookWake();
if(FB){
  if(pendingJoin && pendingJoin!==listId){ const fresh=!listId; connect(pendingJoin,fresh); toast('Mit der gemeinsamen Liste verbunden.'); }
  else if(listId) connect(listId,false);
}
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
