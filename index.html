<script>
// Zeigt Fehler direkt auf der Seite an (hilft bei der Fehlersuche auf dem Handy)
window.addEventListener('error', function (e) {
  var t = e.target && e.target !== window && (e.target.src || e.target.href);
  if (t && String(t).indexOf(location.origin) !== 0) return; // fremde Dateien (Schriften) ignorieren
  var msg = t ? 'Datei konnte nicht geladen werden: ' + String(t).split('/').pop()
              : 'Fehler: ' + (e.message || '?') + ' (Zeile ' + (e.lineno || '?') + ')';
  var d = document.getElementById('err');
  if (!d) { d = document.createElement('div'); d.id = 'err';
    d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#B3261E;color:#fff;padding:10px 12px;border-radius:10px;font:14px/1.4 system-ui,sans-serif';
    (document.body || document.documentElement).appendChild(d); }
  d.textContent = msg;
}, true);
</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600;700&family=Montserrat:wght@700&display=swap">
<style>
:root{
  --paper:#F3F5F2; --sheet:#FFFFFF; --ink:#23262D; --muted:#5F6571;
  --pen:#26358C; --pen-soft:#E6E9F6; --leaf:#557257; --endo:#8A3E6B; --endo-soft:#F6E9F0; --rule:#C9CEDA; --done:#9AA0AC;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10131A; --sheet:#191D27; --ink:#E6E8EE; --muted:#9CA2AF;
    --pen:#A7B5FF; --pen-soft:#232A46; --leaf:#8DB08E; --endo:#E3A6CA; --endo-soft:#35222E; --rule:#343A4B; --done:#646A78;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10131A; --sheet:#191D27; --ink:#E6E8EE; --muted:#9CA2AF;
  --pen:#A7B5FF; --pen-soft:#232A46; --leaf:#8DB08E; --endo:#E3A6CA; --endo-soft:#35222E; --rule:#343A4B; --done:#646A78;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);margin:0;-webkit-text-size-adjust:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
body.noscroll{overflow:hidden}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:8px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
.lbl{font:700 .7rem/1.2 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Kopf */
.head{display:flex;align-items:flex-end;gap:12px;padding-top:18px}
.head h1{font:700 3rem/1 var(--hand);color:var(--pen);margin:0;text-wrap:balance}
.head svg{width:74px;height:30px;flex:none;color:var(--leaf);margin-bottom:8px}
.count{margin:4px 0 18px;color:var(--muted);font-size:.95rem}
.search{position:relative;margin-bottom:16px}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px 12px 42px;border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--pen)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

/* Registerreiter */
.tabs{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1.5px solid var(--rule);margin-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--rule);border-bottom:none;border-radius:10px 10px 0 0;background:transparent;padding:8px 14px 6px;font:700 .72rem/1.2 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-bottom:-1.5px}
.tab[aria-pressed="true"]{background:var(--sheet);color:var(--pen);border-color:var(--rule);border-bottom:1.5px solid var(--sheet)}

/* Liste */
.group{margin-top:22px}
.group>.lbl{margin:0 0 4px 2px}
.list{list-style:none;margin:0;padding:0 16px;background:var(--sheet);border-radius:14px;border:1px solid var(--rule)}
.list li+li{border-top:1.5px dotted var(--rule)}
.row{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 0;cursor:pointer}
.row .t{font:700 1.75rem/1.1 var(--hand);color:var(--pen)}
.row .t.long{font-size:1.35rem;line-height:1.15}
.row .fav{color:#C2415B;margin-left:6px;font-family:var(--body);font-size:.95rem;vertical-align:middle}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:4px;font-size:.88rem;color:var(--muted)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.on{background:var(--pen);border-color:var(--pen)}
.diff{display:inline-flex;align-items:center;gap:6px}
.est{color:var(--muted);font-size:.8em;white-space:nowrap}
.tag{font:700 .64rem/1 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);border:1.5px solid currentColor;border-radius:99px;padding:4px 7px 3px}
.empty{padding:28px 4px;color:var(--muted)}

/* Rezept */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--rule)}
.btn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:99px;padding:7px 14px;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);font-weight:700}
.back{border:0;background:none;padding:7px 0;color:var(--pen);font-weight:700;cursor:pointer}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:20px 18px 26px;margin-top:16px}
.rtitle{font:700 2.7rem/1.02 var(--hand);color:var(--pen);margin:6px 0 14px;text-wrap:balance}
.rtitle.long{font-size:2rem;line-height:1.08}
.favbtn[aria-pressed="true"]{border-color:#C2415B;background:transparent;color:#C2415B}
.stephead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stephead h2{margin-bottom:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;padding:14px 0;border-block:1.5px dotted var(--rule)}
.facts div{display:flex;flex-direction:column;gap:4px}
.facts b{font-weight:700;font-size:1rem}
.scale{display:flex;align-items:center;gap:12px;margin:18px 0 4px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--rule);border-radius:99px;overflow:hidden}
.step button{border:0;background:none;width:42px;height:40px;font-size:1.3rem;cursor:pointer;color:var(--pen)}
.step button:disabled{color:var(--done);cursor:default}
.step output{min-width:108px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.reset{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem}
.cols{display:grid;gap:8px 40px;margin-top:10px}
@media (min-width:760px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.cols h2{font:700 2.1rem/1 var(--hand);margin:18px 0 6px;color:var(--ink)}
.cols h3{margin:16px 0 2px}
.ing{list-style:none;margin:0;padding:0}
.ing li{border-bottom:1.5px dotted var(--rule)}
.ing label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
.ing input{appearance:none;flex:none;width:20px;height:20px;margin-top:3px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;cursor:pointer;background:var(--sheet)}
.ing input:checked{background:var(--pen);border-color:var(--pen)}
.ing input:checked::after{content:"";width:5px;height:10px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ing:not(.picking) input:checked+span{color:var(--done);text-decoration:line-through}
.picking input:checked{background:var(--leaf);border-color:var(--leaf)}
.picking li.basic{color:var(--done)}
.picking li.basic input{opacity:.35;cursor:default}
.picking li.basic label{cursor:default}
.picking small{color:var(--muted);font-size:.8rem}
.pickhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;background:var(--pen-soft);border-radius:10px;padding:8px 12px;margin:4px 0 6px;font-weight:700;color:var(--pen)}
.linkbtn{border:0;background:none;color:var(--pen);text-decoration:underline;cursor:pointer;padding:4px 2px;font-weight:400}
.pickbar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:nowrap;margin-top:12px;padding:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:4}
.pickbar .btn{padding:9px 12px;white-space:nowrap}
.pickbar .primary{flex:1;justify-content:center}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--sheet);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.q{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;border-bottom:1.5px dotted var(--rule);cursor:pointer}
.steps li::before{content:counter(s);width:30px;height:30px;border:1.5px solid var(--pen);color:var(--pen);border-radius:50%;display:grid;place-items:center;font:700 1.25rem/1 var(--hand)}
.steps li.done{color:var(--done)}
.steps li.done::before{background:var(--pen-soft);border-color:var(--done);color:var(--done)}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.notes{margin-top:26px;border:1.5px solid var(--ink);border-radius:4px;padding:10px 14px 12px;position:relative}
.notes .nh{font:700 1.7rem/1 var(--hand);background:var(--sheet);padding:0 6px;position:absolute;top:-.8rem;left:12px}
.notes p{margin:10px 0 0}
.tbtn{vertical-align:baseline;display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--pen);background:var(--pen-soft);color:var(--pen);border-radius:99px;padding:0 8px;margin:0 1px;font:inherit;font-weight:700;cursor:pointer;line-height:1.5;white-space:nowrap}
.tbtn::before{content:"⏱\FE0E";font-weight:400;font-size:.9em}
.done .tbtn{border-color:var(--done);background:transparent;color:var(--done)}
.tbar{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:6px;max-width:560px;margin:0 auto;pointer-events:none}
body.cooking .tbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tm{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tm .tl{flex:1;min-width:0;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.tm .tt{font:700 1.35rem/1 var(--body);font-variant-numeric:tabular-nums}
.tm button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:10px;min-width:40px;height:36px;font:inherit;font-weight:700;cursor:pointer}
.tm.ring{background:#B3261E;color:#fff}
@media (prefers-reduced-motion:no-preference){.tm.ring{animation:pulse 1s infinite}}
@keyframes pulse{50%{opacity:.8}}

/* Einkaufsliste */
.subrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:4px 0 18px}
.subrow .count{margin:0}
.vegbtn{padding:5px 12px;font-size:.88rem}
.vegbtn[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf);color:var(--sheet);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap}
#endoF[aria-pressed="true"]{border-color:var(--endo);background:var(--endo);color:var(--sheet)}
.tag.endo{color:var(--endo)}
.tag.endo.tipp{border-style:dashed}
.endobox{margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:var(--endo-soft);border-left:4px solid var(--endo);font-size:.95rem}
.endobox.nein{background:transparent;border:1.5px dotted var(--rule);border-left:4px solid var(--rule)}
.endobox .eh{font-weight:700;color:var(--endo)}
.endobox.nein .eh{color:var(--muted)}
.endobox p{margin:4px 0 0}
.endobox details{margin-top:6px}
.endobox summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.endobox ul{margin:6px 0 0;padding-left:20px}
.endobox li{margin:2px 0}
.endobox small{display:block;color:var(--muted);margin-top:6px}
a.btn{text-decoration:none;color:var(--ink)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--pen);color:var(--sheet);font:700 .78rem/22px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.badge:empty{display:none}
.barR{display:flex;gap:6px;align-items:center}
.cartadd{margin-top:14px}
.addnote{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.stitle{font:700 2.7rem/1.02 var(--hand);color:var(--pen);margin:0 0 4px}
.sstat{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.addform{display:flex;gap:8px;margin-bottom:14px}
.addform input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink)}
.addform input:focus{outline:none;border-color:var(--pen)}
.addform button{flex:none;border:0;border-radius:10px;background:var(--pen);color:var(--sheet);font-weight:700;padding:0 16px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{max-width:100%;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:99px;padding:3px 4px 3px 10px;font-size:.85rem;background:var(--paper)}
.chip .cht{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip button{flex:none;border:0;background:none;cursor:pointer;color:var(--muted);width:24px;height:24px;border-radius:50%}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;align-items:center;gap:4px 8px;border-bottom:1.5px dotted var(--rule);min-height:52px}
.chk{width:24px;height:24px;border:1.5px solid var(--muted);border-radius:6px;background:var(--sheet);cursor:pointer;display:grid;place-items:center;padding:0}
.done .chk{background:var(--pen);border-color:var(--pen)}
.done .chk::after{content:"";width:6px;height:11px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it{border:0;background:none;text-align:left;padding:8px 0;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.it small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .it .txt{color:var(--done);text-decoration:line-through}
.ic{border:0;background:none;width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:1rem}
.ic:hover{background:var(--pen-soft);color:var(--pen)}
.edit-in{width:100%;font:inherit;padding:6px 8px;border:1.5px solid var(--pen);border-radius:8px;background:var(--sheet);color:var(--ink)}
.shop li.editing{grid-template-columns:minmax(0,1fr) auto;padding:6px 0}
.editbox{display:flex;flex-direction:column;gap:6px}
.dhead{margin:20px 0 2px}
.sactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.btn.warn{border-color:#B3261E;color:#B3261E}
.sempty{color:var(--muted);padding:18px 0 6px}
#sharetxt{width:100%;min-height:140px;margin-top:12px;font:inherit;font-size:.9rem;border:1.5px solid var(--rule);border-radius:10px;padding:10px;background:var(--sheet);color:var(--ink)}
.sharebox{margin-top:26px;padding:14px;border:1.5px dashed var(--rule);border-radius:12px}
.sharebox p{margin:6px 0 10px;font-size:.92rem;color:var(--muted)}
.sharebox .small{font-size:.85rem}
.sharebox details{margin-top:12px}
.sharebox summary{cursor:pointer;color:var(--pen);font-weight:700}
.syncline{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);margin:-8px 0 14px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--done);flex:none}
.s-online .sdot{background:var(--leaf)}
.s-offline .sdot{background:#C48A1A}
.s-error .sdot{background:#B3261E}
.toast{width:max-content;min-width:min(320px,calc(100% - 32px));justify-content:space-between;position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:.95rem}
.toast a{color:var(--paper);font-weight:700;white-space:nowrap}
/* Wochenplan */
.wtitle{font:700 2.8rem/1 var(--hand);color:var(--pen);margin:18px 0 2px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 6px}
.weeknav .wk{text-align:center}
.weeknav .wk b{display:block;font-size:1.05rem}
.weeknav .wk span{font-size:.85rem;color:var(--muted)}
.arrow{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);background:var(--sheet);cursor:pointer;font-size:1.3rem;color:var(--pen)}
.wsum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.wsum p{margin:0;color:var(--muted);font-size:.92rem}
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:10px 14px 6px}
.day.today{border-color:var(--pen);box-shadow:inset 4px 0 0 var(--pen)}
.day.past{opacity:.7}
.day.compact{padding:6px 14px}
.day.compact .dn{font-size:1.2rem}
.days .day.compact + .day.compact{margin-top:-6px}
.day.past .dn{color:var(--muted)}
.dayhead{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.dayhead .dn{font:700 1.55rem/1 var(--hand);color:var(--pen)}
.dayhead .dd{font-size:.85rem;color:var(--muted)}
.dayhead .tg{margin-left:auto;font:700 .62rem/1 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--sheet);background:var(--pen);border-radius:99px;padding:4px 8px}
.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px;border-top:1.5px dotted var(--rule);min-height:50px}
.entry .open{border:0;background:none;text-align:left;padding:8px 0;cursor:pointer;min-width:0}
.entry .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;line-height:1.3}
.entry .s{display:block;font-size:.8rem;color:var(--muted)}
.entry.note .t{font-weight:400;font-style:italic}
.pill{font-size:.8rem;border:1.5px solid var(--rule);border-radius:99px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bought{color:var(--leaf);font-weight:700}
.more{width:40px;height:40px;border-radius:50%;border:0;background:none;cursor:pointer;font-size:1.3rem;color:var(--muted)}
.dayadd{border:0;background:none;color:var(--pen);font-weight:700;padding:10px 0;cursor:pointer;width:100%;text-align:left;border-top:1.5px dotted var(--rule)}
.entries:empty + .dayadd{border-top:0}
.wsync{margin-top:18px;font-size:.88rem;color:var(--muted)}
.wsync a{color:var(--pen);font-weight:700}
/* Auswahlfenster von unten */
.backdrop{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:45}
.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:46;background:var(--sheet);border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--rule);margin:2px auto 8px;flex:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.sh-head h2{font:700 1.9rem/1.1 var(--hand);color:var(--pen);margin:0;min-width:0}
.sh-body{overflow-y:auto;margin-top:8px;flex:1;min-height:0}
.sinput{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-bottom:1.5px dotted var(--rule);background:none;text-align:left;padding:11px 2px;cursor:pointer}
.opt small{color:var(--muted);font-size:.8rem;white-space:nowrap}
.seg{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:10px 0;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1.5px solid var(--rule);background:var(--sheet);border-radius:99px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--sheet);font-weight:700}
.row2{display:flex;gap:8px;margin-top:10px}
.row2 input{flex:1;min-width:0}
.daygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.daygrid button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:12px;padding:8px 4px;cursor:pointer;line-height:1.2}
.daygrid button b{display:block}
.daygrid button span{font-size:.75rem;color:var(--muted)}
.daygrid button[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.daygrid button small{display:block;font-size:.7rem;color:var(--leaf);font-weight:700}
.sbar{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--rule);margin-top:6px;flex:none}
.sbar .primary{flex:1;justify-content:center}
.ing small.for{display:block;color:var(--muted);font-size:.8rem}
/* Navigation unten */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{flex:1;max-width:160px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;color:var(--muted);font:700 .72rem/1.2 var(--label);letter-spacing:.06em;text-transform:uppercase;position:relative}
.bnav svg{width:24px;height:24px}
.bnav button[aria-current="page"]{color:var(--pen)}
.bnav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:.7rem;line-height:18px;padding:0 5px}
/* Kochmodus */
#cook{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
#cook[hidden]{display:none}
.ck-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ck-top .btn{white-space:nowrap;padding:7px 12px}
.ck-top .lbl{white-space:nowrap}
.ck-prog{height:4px;background:var(--rule);border-radius:4px;margin:10px 0 0;overflow:hidden}
.ck-prog i{display:block;height:100%;background:var(--pen);transition:width .2s}
.ck-body{flex:1;overflow-y:auto;padding:18px 2px;max-width:760px;width:100%;margin:0 auto;touch-action:pan-y}
.ck-title{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.ck-num{font:700 3.2rem/1 var(--hand);color:var(--pen);margin-bottom:8px}
.ck-step{font-size:clamp(1.35rem,5.2vw,2rem);line-height:1.4;margin:0;text-wrap:pretty}
.ck-ings{margin-top:22px;border-top:1.5px dotted var(--rule);padding-top:10px}
.ck-ings ul{list-style:none;padding:0;margin:4px 0 0}
.ck-ings li{padding:5px 0;border-bottom:1.5px dotted var(--rule)}
.ck-nav{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto}
.ck-nav button{flex:1;min-height:56px;border-radius:14px;font-size:1.1rem;justify-content:center}
@media (prefers-reduced-motion:no-preference){.row,.btn,.tab{transition:background-color .15s,color .15s}}
</style>

</head>
<body>
<div class="wrap">
  <main id="home">
    <div class="head">
      <h1>Rezeptordner</h1>
      <svg viewBox="0 0 74 30" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 20 Q36 16 72 12"/><path d="M14 19c-3-7 1-12 6-13 1 6-2 10-6 13Z"/><path d="M14 19c4 6 10 7 13 6-3-5-8-7-13-6Z"/><path d="M30 17c-3-7 1-12 6-13 1 6-2 10-6 13Z"/><path d="M30 17c4 6 10 7 13 6-3-5-8-7-13-6Z"/><path d="M46 15c-3-7 1-12 6-13 1 6-2 10-6 13Z"/><path d="M46 15c4 6 10 7 13 6-3-5-8-7-13-6Z"/></svg>
    </div>
    <div class="subrow"><p class="count" id="count"></p><div class="filters"><button class="btn vegbtn" type="button" id="veg" aria-pressed="false">🌱 Nur vegan</button><button class="btn vegbtn" type="button" id="endoF" aria-pressed="false">✿ Endo-freundlich</button></div></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Rezept oder Zutat suchen …" autocomplete="off" aria-label="Rezept oder Zutat suchen">
    </div>

    <div id="groups"></div>
  </main>
  <article id="detail" hidden></article>
  <section id="shop" hidden></section>
  <section id="week" hidden></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="tbar" id="tbar" aria-live="polite"></div>
<div class="backdrop" id="bd" hidden></div>
<div class="bsheet" id="bs" role="dialog" aria-modal="true" hidden></div>
<div id="cook" hidden role="dialog" aria-modal="true" aria-label="Kochmodus"></div>
<nav class="bnav" aria-label="Hauptnavigation">
  <button type="button" data-nav="rezepte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>Rezepte</button>
  <button type="button" data-nav="favoriten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>Favoriten</button>
  <button type="button" data-nav="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Woche</button>
  <button type="button" data-nav="einkauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.3"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Einkauf<span class="badge" data-cartn></span></button>
</nav>

<script src="rezepte.js"></script>
<script>
(function(){
const dataEl=document.getElementById('data');
const R = window.REZEPTE || (dataEl ? JSON.parse(dataEl.textContent) : null);
if(!R){ document.getElementById('groups').innerHTML='<p class="empty">Die Rezepte konnten nicht geladen werden. Bitte mit Internet neu öffnen.</p>'; return; }
const ORDER = ['Frühstück','Salat','Pasta & Nudeln','Pfanne & Wok','Curry & Eintopf','Bowls & Teller','Burger & Wraps','Aus dem Ofen','Saucen','Backen','Snacks'];
const cats = [...new Set(R.map(r=>r.cat))].sort((a,b)=>(ORDER.indexOf(a)+99)%99 - (ORDER.indexOf(b)+99)%99 || a.localeCompare(b));
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat = 'Alle';
const FAV='Favoriten';
try{ cat = localStorage.getItem('rz-cat') || 'Alle'; if(cat!=='Alle' && cat!==FAV && !cats.includes(cat)) cat='Alle'; }catch(e){}
function loadSet(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }
function saveArr(k,a){ try{ localStorage.setItem(k,JSON.stringify(a)); }catch(e){} }
let favs=new Set(loadSet('rz-favs'));
let vegOnly=false; try{ vegOnly=localStorage.getItem('rz-vegan')==='1'; }catch(e){}
let endoOnly=false; try{ endoOnly=localStorage.getItem('rz-endo')==='1'; }catch(e){}
const ENDO_ORDER={ja:0,anpassbar:1,nein:2};
function endoSt(r){ return r.endo ? r.endo.status : 'nein'; }
function passF(r){ return (!vegOnly||r.tags.includes('vegan')) && (!endoOnly||endoSt(r)!=='nein'); }
const PLUS={omega3:'Omega-3',ballaststoffe:'Ballaststoffe',entzuendung:'Entzündungshemmende Zutaten'};
function endoTag(r){ const s=endoSt(r); return s==='ja'?'<span class="tag endo">endo</span>':(s==='anpassbar'?'<span class="tag endo tipp">endo + Tipp</span>':''); }
function endoBox(r){
  const e=r.endo; if(!e) return '';
  const plus=(e.plus||[]).map(k=>PLUS[k]).filter(Boolean);
  const head={ja:'✿ Endo-freundlich',anpassbar:'✿ Endo-freundlich mit kleiner Änderung',nein:'Nicht endo-freundlich'}[e.status];
  return '<div class="endobox '+e.status+'"><div class="eh">'+head+'</div>'+
    (e.status==='anpassbar'?'<p><b>Tipp:</b> '+esc(e.tipp)+'</p>':'')+
    (e.grund?'<p>'+(e.status==='nein'?'':'Grund: ')+esc(e.grund)+'</p>':'')+
    (plus.length?'<p>Pluspunkte: '+plus.join(' · ')+'</p>':'')+
    '<details><summary>Was heißt endo-freundlich?</summary><ul>'+
    '<li>reichlich Gemüse (ab ca. 150 g pro Portion)</li><li>kein rotes oder verarbeitetes Fleisch</li>'+
    '<li>Fett vor allem aus Pflanzenölen, wenig Butter, Sahne und Käse</li><li>kein Alkohol</li>'+
    '<li>bei Gebäck und Snacks: wenig Zucker, keine Butter als Hauptzutat</li></ul>'+
    '<small>Pluspunkte: Omega-3 (z. B. Chia, Leinsamen, Rapsöl, Walnüsse), Ballaststoffe (Hülsenfrüchte, Vollkorn, Nüsse), entzündungshemmende Zutaten (Ingwer, Kurkuma, Blattgemüse, Kohl, Beeren). Einordnung nach aktuellem Forschungsstand, ersetzt keine ärztliche Beratung.</small></details></div>';
}
try{ localStorage.removeItem('rz-recent'); }catch(e){}
function toggleFav(id){ favs.has(id)?favs.delete(id):favs.add(id); saveArr('rz-favs',[...favs]); }
function setCat(c){ cat=c; try{localStorage.setItem('rz-cat',cat)}catch(_){} renderTabs(); renderList(); }

/* Suche: unempfindlich gegen Umlaute, doppelte Buchstaben und kleine Tippfehler */
function norm(s){ return String(s).toLowerCase().replace(/ä|ae/g,'a').replace(/ö|oe/g,'o').replace(/ü|ue/g,'u').replace(/ß/g,'s')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/([a-z])\1+/g,'$1'); }
function lev(a,b){ if(Math.abs(a.length-b.length)>1) return 2; let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ const c=[i]; for(let j=1;j<=b.length;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[b.length]; }
const IDX=new Map(R.map(r=>{ const h=norm([r.title,r.cat,...r.tags,...r.groups.flatMap(g=>[g.title||'',...g.items.map(i=>i.t)])].join(' ')); return [r.id,{h:' '+h+' ',tok:[...new Set(h.split(' ').filter(Boolean))]}]; }));
function matches(r,words){ const x=IDX.get(r.id);
  return words.every(w=> x.h.includes(w) || (w.length>=4 && x.tok.some(t=> lev(t.slice(0,w.length),w)<=1 || lev(t,w)<=1))); }

/* ---------- Mengen ---------- */
const FR = {0.25:'¼',0.5:'½',0.75:'¾'};
function num(n,u){
  if(['g','ml'].includes(u)){
    if(n>=100) return String(Math.round(n/5)*5);
    if(n>=10) return String(Math.round(n));
    n = Math.round(n*2)/2; return String(n).replace('.',',');
  }
  const q = Math.round(n*4)/4;
  if(q===0) return '¼';
  const w = Math.floor(q), f = +(q-w).toFixed(2);
  return (w? String(w):'') + (FR[f]||'');
}
function qty(it,f){
  if(it.m==null) return '';
  const u = it.u||'';
  const v = Array.isArray(it.m) ? it.m.map(x=>num(x*f,u)).join('–') : num(it.m*f,u);
  return (it.ca?'ca. ':'') + v + (u?' '+u:'');
}
/* Zeitangaben wie „ca. 20 min“, „2–3 Minuten“, „1,5–2 Stunden“ werden zu Timer-Knöpfen */
const TIME_RE=/(\d+(?:,\d+)?)(?:\s*[–-]\s*(\d+(?:,\d+)?))?\s*(Sekunden|Sek\.|min\.?|Minuten|Minute|Min\.|h\b|Stunden|Stunde|Std\.)/gi;
function secs(v,unit){ const n=parseFloat(String(v).replace(',','.')); const u=unit.toLowerCase(); return Math.round(n*(u.startsWith('s')&&!u.startsWith('st')?1:(u.startsWith('h')||u.startsWith('st'))?3600:60)); }
function stepHtml(txt,si){
  let out='',last=0; txt=String(txt);
  for(const m of txt.matchAll(TIME_RE)){
    const sec=secs(m[1],m[3]); if(!sec||sec>12*3600) continue;
    out+=esc(txt.slice(last,m.index))+'<button type="button" class="tbtn" data-sec="'+sec+'" data-si="'+si+'" aria-label="Timer '+esc(m[0])+' starten">'+esc(m[0])+'</button>';
    last=m.index+m[0].length;
  }
  return out+esc(txt.slice(last));
}
const LEVEL=['','leicht','mittel','schwer'];
function dots(n){ if(!n) return ''; let h='<span class="dots" aria-hidden="true">'; for(let i=1;i<=3;i++) h+='<i class="'+(i<=n?'on':'')+'"></i>'; return h+'</span>'; }
function diffHtml(n){ return n ? '<span class="diff">'+dots(n)+' '+LEVEL[n]+'</span>' : ''; }
function fmtMin(m){ if(!m) return ''; if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return h+' h'+(r?' '+r+' min':''); }
function yieldText(r){ return r.servings ? r.servings+' '+r.unit : ''; }
const EST=' <small class="est">(geschätzt)</small>';
function isEst(r,k){ return (r.est||[]).includes(k); }

/* ---------- Übersicht ---------- */
function renderTabs(){
  $('#tabs').innerHTML = ['Alle',FAV,...cats].map(c=>'<button class="tab" type="button" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+(c===FAV?'♥ ':'')+esc(c)+'</button>').join('');
}
function renderList(){
  const q = $('#q').value.trim(), words = norm(q).split(' ').filter(Boolean);
  const hits = R.filter(r=>(cat==='Alle'||r.cat===cat||(cat===FAV&&favs.has(r.id))) && passF(r) && (!words.length || matches(r,words)));
  $('#veg').setAttribute('aria-pressed',vegOnly); $('#endoF').setAttribute('aria-pressed',endoOnly);
  const nf=R.filter(passF), fl=[vegOnly?'vegan':'',endoOnly?'endo-freundlich':''].filter(Boolean).join(' und ');
  $('#count').textContent = fl ? nf.length+' von '+R.length+' Rezepten '+fl+(endoOnly?' ('+nf.filter(r=>endoSt(r)==='anpassbar').length+' davon mit Tipp)':'') : R.length+' Rezepte in '+cats.length+' Kategorien';
  if(!hits.length){ $('#groups').innerHTML='<p class="empty">'+(cat===FAV && !words.length ? 'Noch keine Favoriten. Öffne ein Rezept und tippe oben auf das Herz ♡.' : (q?'Kein Rezept passt zu „'+esc(q)+'“':'Keine Rezepte')+(cat!=='Alle'?' in „'+esc(cat)+'“':'')+(fl?' ('+fl+')':'')+'.'+(q?' Versuch es mit einer Zutat, z. B. „Pilze“.':''))+'</p>'; return; }
  $('#groups').innerHTML = cats.filter(c=>hits.some(r=>r.cat===c)).map(c=>
    '<section class="group"><h2 class="lbl">'+esc(c)+'</h2><ul class="list">'+
    hits.filter(r=>r.cat===c).sort((a,b)=>(endoOnly?ENDO_ORDER[endoSt(a)]-ENDO_ORDER[endoSt(b)]:0)||a.title.localeCompare(b.title,'de')).map(r=>{
      const m = [diffHtml(r.difficulty), r.min?'<span>⏱ '+fmtMin(r.min)+'</span>':'', yieldText(r)?'<span>'+esc(yieldText(r))+'</span>':'', ...r.tags.map(t=>'<span class="tag">'+esc(t)+'</span>'), endoTag(r)].filter(Boolean).join('');
      return '<li><button class="row" type="button" data-id="'+r.id+'"><div class="t'+(r.title.length>38?' long':'')+'">'+esc(r.title)+(favs.has(r.id)?'<span class="fav" aria-label="Favorit">♥</span>':'')+'</div>'+(m?'<div class="meta">'+m+'</div>':'')+'</button></li>';
    }).join('')+'</ul></section>').join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(!b) return; setCat(b.dataset.c); updateNav();});

$('#q').addEventListener('input',renderList);
$('#veg').addEventListener('click',()=>{ vegOnly=!vegOnly; try{ localStorage.setItem('rz-vegan',vegOnly?'1':'0'); }catch(e){} renderList(); });
$('#endoF').addEventListener('click',()=>{ endoOnly=!endoOnly; try{ localStorage.setItem('rz-endo',endoOnly?'1':'0'); }catch(e){} renderList(); });
$('#groups').addEventListener('click',e=>{const b=e.target.closest('.row'); if(b) location.hash=b.dataset.id;});

/* ---------- Rezeptansicht ---------- */
const FACTORS=[0.5,1,1.5,2,3,4];
let cur=null, amount=1, cooked=new Set(), pick=null;
function stepSize(r){ return r.servings>=10 ? 5 : 1; }
function amountLabel(r){ return r.servings ? amount+' '+r.unit : (amount===1?'1× Rezept':String(amount).replace('.',',')+'× Rezept'); }
function factor(r){ return r.servings ? amount/r.servings : amount; }
function renderDetail(r){
  cur=r; amount = r.servings || 1; cooked=new Set(); pick=null;
  if(planPor && planPor.rid===r.id){ amount=planPor.por; } planPor=null;
  const facts = [
    r.difficulty?['Schwierigkeit',diffHtml(r.difficulty)+(isEst(r,'difficulty')?EST:'')]:null,
    r.min?['Zeit',fmtMin(r.min)+(isEst(r,'time')?EST:'')]:null,
    r.rest?['Zusätzlich',esc(r.rest)]:null,
  ].filter(Boolean);
  $('#detail').innerHTML =
    '<div class="bar"><button class="back" type="button" id="back">‹ Rezepte</button>'+
    '<div class="barR"><button class="btn" type="button" id="wake" aria-pressed="'+wakeOn+'">☀ Bildschirm an</button>'+
    '<button class="btn" type="button" id="planBtn" aria-label="In den Wochenplan">📅</button>'+
    '<button class="btn favbtn" type="button" id="favBtn" aria-pressed="'+favs.has(r.id)+'" aria-label="Als Favorit merken">'+(favs.has(r.id)?'♥':'♡')+'</button></div></div>'+
    '<div class="sheet"><div class="lbl">'+esc(r.cat)+(r.tags.length?' · '+r.tags.map(esc).join(' · '):'')+'</div>'+
    '<h1 class="rtitle'+(r.title.length>45?' long':'')+'">'+esc(r.title)+'</h1>'+
    (facts.length?'<div class="facts">'+facts.map(f=>'<div><span class="lbl">'+f[0]+'</span><b>'+f[1]+'</b></div>').join('')+'</div>':'')+endoBox(r)+
    '<div class="scale"><span class="lbl">'+(r.servings?'Menge':'Rezeptmenge')+(isEst(r,'servings')?EST:'')+'</span><div class="step"><button type="button" id="minus" aria-label="weniger">−</button><output id="amt"></output><button type="button" id="plus" aria-label="mehr">+</button></div><button class="reset" type="button" id="reset" hidden>zurücksetzen</button></div>'+
    '<div class="cols"><section><h2>Zutaten</h2><div id="ings"></div>'+
    '<button class="btn cartadd" type="button" id="toCart"></button>'+
    '<p class="addnote" id="addnote" hidden></p></section>'+
    '<section><div class="stephead"><h2>Zubereitung</h2><button class="btn primary" type="button" id="cookBtn">▶ Jetzt kochen</button></div><ol class="steps" id="steps">'+r.steps.map((s,i)=>'<li><span>'+stepHtml(s,i)+'</span></li>').join('')+'</ol><p class="hint">Tipp: Schritt antippen, um ihn abzuhaken. Zeiten mit ⏱ antippen startet einen Timer.</p>'+
    (r.notes.length?'<div class="notes"><span class="nh">Notizen</span>'+r.notes.map(n=>'<p>'+esc(n)+'</p>').join('')+'</div>':'')+
    '</section></div></div>';

const SECS=['Obst & Gemüse','Kühlregal','Brot & Backwaren','Nudeln, Reis & Getreide','Konserven & Gläser','Backen & Süßes','Gewürze, Öl & Saucen','Nüsse & Samen','Tiefkühl','Getränke','Sonstiges'];

  ['Nudeln, Reis & Getreide',/nudel|spaghetti|pasta|orzo|\breis\b|naturreis|quinoa|bulgur|couscous|buchweizen(?!mehl)|gerste|hafer|kleie|grieß|linsen|getrocknete kichererbsen|cornflakes|panko/],

  ['Backen & Süßes',/mehl|zucker(?!schote)|backpulver|natron|vanille|kakao|schoko|kuvert|stärke|sirup|agaven|honig|aquafaba|semmelbrösel/],
  ['Brot & Backwaren',/brot|brötchen|wrap|tortilla/],
  ['Gewürze, Öl & Saucen',/salz|pfeffer|pulver|gewürz|zimt|muskat|kurkuma|kümmel|cumin|oregano|thymian|rosmarin|lorbeer|piment|wacholder|beifu|kardamom|galgant|bockshorn|koriandersamen|chiliflocken|senf|sojas|soße|sauce|sriracha|sambal|currypaste|ketchup|miso|marmite|gemahlen|getrocknet|kala namak/],

];
function autoSec(it){
  const n=String(it.text!=null?it.text:it.name).toLowerCase();
  for(let i=0;i<SEC_RULES.length;i++){
    // Kleine Löffelmengen ohne eindeutigen Treffer sind meist Gewürze

// Grundzutaten, die man meistens zu Hause hat
// „Karotte, gewürfelt“ → „Karotte“, aber „Sojasauce, hell“ bleibt „Sojasauce, hell“
function baseName(t){
  const i=t.indexOf(','); if(i<0) return t.trim();
  const rest=t.slice(i+1).toLowerCase();
  return /(^|\s)(ge(?!räuchert)[a-zäöüß]+t\b|in (feinen |dünnen |breiten |halben )?(ringen|streifen|würfeln|scheiben|stücken|röschen)|entsteint|geschält|gerieben|geschnitten|klein|fein|grob|halbiert|zum )/.test(rest) ? t.slice(0,i).trim() : t.trim();
}
function isBasic(name){
  const s=name.toLowerCase().replace(/\(.*?\)/g,'').trim();
  if(!s) return true;
  if(/^(\S+ )?(salz|pfeffer|wasser|öl|olivenöl|rapsöl|sonnenblumenöl|speiseöl|bratöl)( zum (braten|anbraten|backen))?$/.test(s)) return true;
  if(/zum braten|zum anbraten|für die form/.test(s) && /öl|fett/.test(s)) return true;
  return false;
}
/* Gleiche Zutaten erkennen: Einzahl/Mehrzahl, Größenangaben, kg/g und l/ml */
const SIZE_WORDS=/\b(sehr |)(kleine[rsn]?|große[rsn]?|mittlere[rsn]?|mittelgroße[rsn]?|m\.-große[rsn]?|dicke[rsn]?|reife[rsn]?)\b/g;
function stem(w){
  if(/eier$/.test(w)) return w.slice(0,-2);
  if(/(l|r)n$/.test(w)) return w.slice(0,-1);
  if(/en$/.test(w) && w.length>5) return w.slice(0,-1);
  if(/[^s]s$/.test(w) && w.length>4) return w.slice(0,-1);
  return w;
}
function canon(name){
  const s=String(name).toLowerCase().replace(/\(.*?\)/g,' ').replace(SIZE_WORDS,' ').replace(/\s+/g,' ').trim();
  const w=s.split(' '); w[w.length-1]=stem(w[w.length-1]); return w.join(' ');
}
function normUnit(u,n){ if(u==='kg') return ['g',n==null?n:n*1000]; if(u==='l') return ['ml',n==null?n:n*1000]; return [u,n]; }
function fmtAmt(v,u){
  if(u==='g' && v>=1000) return String(Math.round(v/100)/10).replace('.',',')+' kg';
  if(u==='ml' && v>=1000) return String(Math.round(v/100)/10).replace('.',',')+' l';
  return num(v,u)+(u?' '+u:'');
}
function sumText(it){
  if(it.parts.some(p=>p.a)) return it.parts.map(p=>p.a||(p.n!=null?fmtAmt(p.n,it.u):'')).filter(Boolean).join(' + ');
  if(it.parts.every(p=>p.n==null)) return '';
  return fmtAmt(it.parts.reduce((a,p)=>a+p.n,0),it.u);
}
// Anzeigename: bei mehr als einem Stück die Mehrzahl, sonst die Einzahl, wenn vorhanden
function dispName(it){
  const names=[...new Set([it.name,...it.parts.map(p=>p.nm).filter(Boolean)])];
  if(names.length<2) return it.name;
  const total=it.parts.every(p=>p.n!=null)?it.parts.reduce((a,p)=>a+p.n,0):2;
  const plural=names.filter(n=>{ const l=n.toLowerCase().replace(SIZE_WORDS,' ').replace(/\s+/g,' ').trim(); return l!==canon(n); });
  const single=names.filter(n=>!plural.includes(n));
  return (total>1 ? plural[0]||names[0] : single[0]||names[0]).replace(SIZE_WORDS,'').replace(/\s+/g,' ').trim();
}
// Einfache Mehrzahl für Stückzahlen (Karotte → Karotten, Zwiebel → Zwiebeln, Ei → Eier)
function pluralize(name){
  return name.replace(/(\S+)(\s*\(.*\))?$/,(all,w,rest)=>{
    rest=rest||''; const l=w.toLowerCase();
    if(l==='ei') return w+'er'+rest;
    if(/(e|el|er)$/.test(l) && canon(w)===l) return w+'n'+rest;
    return all; });
}
function shownName(it){
  let n=dispName(it);
  const tot=it.parts.every(p=>p.n!=null)?it.parts.reduce((a,p)=>a+p.n,0):0;
  if(!it.u && tot>1 && it.parts.length>1) n=pluralize(n);
  return n;
}
function itemText(it){ if(it.text!=null) return it.text; const a=sumText(it); return (a?a+' ':'')+shownName(it); }
function addPart(name,u0,n0,a,r){
  const [u,n]=normUnit(u0,n0);
  const key=canon(name)+'|'+u;
  const plainAmt = n==null && !a;
  const hit=shop.items.find(i=>!i.done && i.text==null && (canon(i.name)+'|'+i.u)===key &&
    (n!=null ? i.parts.every(p=>p.n!=null) : plainAmt && i.parts.every(p=>p.n==null && !p.a)));
  const part={rid:r.id,rt:r.title,n:n,a:a,nm:name};
  if(hit){ hit.parts.push(part); return hit; }
  const it={id:newId(),t:stamp(),name:name,u:u,parts:[part],done:false}; shop.items.push(it); return it;
}
function addRecipe(r,f,sel){
  let k=0,n=0; const changed=new Set();
  r.groups.forEach(g=>g.items.forEach(it=>{
    const idx=k++; if(!sel.has(idx)) return;
    const names = it.m==null ? it.t.split(',').map(s=>s.trim()) : [baseName(it.t)];
    names.forEach(name=>{
      name=name.replace(/\s*\((\d+ )?(kleine |große )?Dose[^)]*\)/i,'').trim();
      if(isBasic(name)) return;
      const u=it.u||''; let v=null,a='';
      if(it.m!=null){ if(Array.isArray(it.m)) a=qty(it,f).replace(/^ca\. /,''); else v=it.m*f; }
      changed.add(addPart(name,u,v,a,r)); n++;
    });
  }));
  if(n) commit([...changed],[]);
  return n;
}

function finishEdit(){
  const e=$('#editIn'), se=$('#editSec'); const it=shop.items.find(i=>i.id===editId); editId=null;
  if(e && it){ const v=e.value.trim(); let ch=false;
    if(!v){ shop.items=shop.items.filter(i=>i!==it); commit([],[it]); renderShop(); return; }
    if(v!==itemText(it)){ it.text=v; ch=true; }
    if(se && se.value!==secOf(it)){ it.sec=se.value; ch=true; }
    if(ch) commit([it],[]); }
  renderShop();
}
function shareText(){ const open=shop.items.filter(i=>!i.done);
  return 'Einkaufsliste'+SECS.map(sec=>{ const its=open.filter(i=>secOf(i)===sec); return its.length?'\n\n'+sec+'\n'+its.map(i=>'• '+itemText(i)).join('\n'):''; }).join(''); }
async function share(){
  const txt=shareText();
  if(navigator.share){ try{ await navigator.share({title:'Einkaufsliste',text:txt}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(txt); toast('Liste kopiert. Du kannst sie jetzt z. B. in WhatsApp einfügen.'); }
  catch(e){ shareFallback=txt; renderShop(); toast('Text unten markieren und kopieren.'); }
}
$('#shop').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, li=b.closest('li'), it=li&&shop.items.find(i=>i.id===li.dataset.id);
  if(act==='back'){ goBack(); return; }
  if(act==='share'){ share(); return; }
  if(act==='sharelink'){ shareLink(); return; }
  if(act==='save'){ finishEdit(); return; }
  if(act==='startshare'){ connect(randomListId(),true); toast('Gemeinsame Liste angelegt. Schick jetzt den Link an andere.'); }
  else if(act==='leave'){ disconnect(); toast('Getrennt. Die Liste bleibt auf diesem Gerät, wird aber nicht mehr abgeglichen.'); }
  else if(act==='toggle'&&it){ it.done=!it.done; commit([it],[]); }
  else if(act==='edit'&&it){ editId=it.id; }
  else if(act==='del'&&it){ shop.items=shop.items.filter(i=>i!==it); commit([],[it]); toast('„'+itemText(it)+'“ gelöscht.'); }
  else if(act==='rmrec'){ const rid=b.dataset.rid, ch=[], rm=[];
    shop.items.forEach(i=>{ if(i.parts.some(p=>p.rid===rid)){ i.parts=i.parts.filter(p=>p.rid!==rid); (i.parts.length||i.custom?ch:rm).push(i); } });
    shop.items=shop.items.filter(i=>!rm.includes(i)); commit(ch,rm); }
  else if(act==='cleardone'){ const rm=shop.items.filter(i=>i.done); shop.items=shop.items.filter(i=>!i.done); commit([],rm); }
  else if(act==='clear'){ confirmClear=true; }
  else if(act==='clearno'){ confirmClear=false; }
  else if(act==='clearyes'){ const rm=shop.items; shop.items=[]; confirmClear=false; commit([],rm); }
  shareFallback='';
  renderShop();
});

const DN=['Mo','Di','Mi','Do','Fr','Sa','So'], DL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dOf=ds=>new Date(ds+'T00:00');
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const today0=()=>{ const t=new Date(); t.setHours(0,0,0,0); return t; };
const monday=d=>{ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const fmtDM=d=>d.getDate()+'.'+(d.getMonth()+1)+'.';
const dayName=ds=>{ const d=dOf(ds); return DL[(d.getDay()+6)%7]+', '+fmtDM(d); };
function kwOf(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
let wkStart=monday(new Date());
function savePlan(){ try{ localStorage.setItem(PK,JSON.stringify(plan)); }catch(e){} }
function planPlain(e){ const o={kind:'plan',date:e.date,t:e.t||stamp()}; if(e.rid){ o.rid=e.rid; o.rt=e.rt; o.por=e.por; o.bought=!!e.bought; } else o.text=e.text; return o; }
function commitPlan(changed,removed){
  savePlan();

    (changed||[]).forEach(e=>b.set(c.doc(e.id),planPlain(e)));
    (removed||[]).forEach(e=>b.delete(c.doc(e.id)));
    b.commit().catch(err=>{ console.warn(err); toast('Speichern im gemeinsamen Plan hat nicht geklappt.'); }); }
}

    '<button class="opt" type="button" data-del style="color:#B3261E">✕ Aus dem Plan entfernen</button></div>','more:'+id);
}
/* Woche einkaufen: Zutaten aller noch nicht eingekauften Gerichte, zusammengerechnet */
let wRows=[], wSel=new Set(), wEntries=[];
function openWeekShop(){
  const td=isoD(today0()), a=isoD(wkStart)<td?td:isoD(wkStart), z=isoD(addD(wkStart,6));
  wEntries=plan.filter(e=>e.rid&&!e.bought&&e.date>=a&&e.date<=z&&recOf(e));
  const map=new Map();
  wEntries.forEach(e=>{ const r=recOf(e), f=r.servings?e.por/r.servings:e.por, dn=DN[(dOf(e.date).getDay()+6)%7];
    r.groups.forEach(g=>g.items.forEach(it=>{
      const names = it.m==null ? it.t.split(',').map(x=>x.trim()) : [baseName(it.t)];
      names.forEach(name=>{
        name=name.replace(/\s*\((\d+ )?(kleine |große )?Dose[^)]*\)/i,'').trim(); if(isBasic(name)) return;
        let v=null,aTxt=''; if(it.m!=null){ if(Array.isArray(it.m)) aTxt=qty(it,f).replace(/^ca\. /,''); else v=it.m*f; }
        const [u,nv]=normUnit(it.u||'',v), key=canon(name)+'|'+u+(aTxt||v==null?'|x':'');
        const row=map.get(key)||{name,u,sum:0,has:false,a:[],days:new Set(),parts:[]};
        if(nv!=null){ row.sum+=nv; row.has=true; } if(aTxt) row.a.push(aTxt);
        row.days.add(dn); row.parts.push({r,name,u:it.u||'',v,a:aTxt}); map.set(key,row);
      });
    }));
  });
  wRows=[...map.values()]; wSel=new Set();
  const txt=x=>x.a.length?x.a.join(' + ')+' ':(x.has?fmtAmt(x.sum,x.u)+' ':'');
  const multi=new Set(wEntries.map(e=>e.date)).size>1;
  openSheet('<div class="sh-head"><h2>Woche einkaufen</h2><button class="btn" type="button" data-close>Abbrechen</button></div>'+
    '<p style="margin:2px 0 0;color:var(--muted);font-size:.9rem">'+wEntries.length+(wEntries.length===1?' Gericht':' Gerichte')+(wEntries.length>1?' · gleiche Zutaten zusammengerechnet':'')+'. Was musst du kaufen?</p>'+
    '<div style="margin:6px 0;flex:none"><button class="linkbtn" type="button" data-wsel="all">Alle</button> · <button class="linkbtn" type="button" data-wsel="none">Keine</button></div>'+
    '<div class="sh-body"><ul class="ing picking">'+wRows.map((x,i)=>'<li><label for="w'+i+'"><input type="checkbox" id="w'+i+'" data-wi="'+i+'"><span><span class="q">'+esc(txt(x))+'</span>'+esc(x.parts.length>1?pluralize(x.name):x.name)+(multi?'<small class="for">für '+[...x.days].join(', ')+'</small>':'')+'</span></label></li>').join('')+'</ul></div>'+
    '<div class="sbar"><button class="btn primary" type="button" id="wAdd" disabled>Zutaten auswählen</button></div>','wshop');
}
function updW(){ const b=$('#wAdd'), n=wSel.size; b.disabled=!n; b.textContent=n? n+(n===1?' Zutat':' Zutaten')+' auf die Einkaufsliste':'Zutaten auswählen'; }

$('#bs').addEventListener('click',e=>{
  const t=e.target, ctx=$('#bs').dataset.ctx||'';
  if(t.closest('[data-close]')){ closeSheet(); return; }
  const pc=t.closest('[data-pcat]'); if(pc){ addCat=pc.dataset.pcat; renderPicker(); return; }
  const pr=t.closest('[data-prid]'); if(pr){ const r=R.find(x=>x.id===pr.dataset.prid); addToPlan(r,addDate,r.servings||1); toast('„'+r.title+'“ geplant für '+dayName(addDate)); return; }
  if(t.closest('#noteAdd')){ const v=$('#noteIn').value.trim(); if(!v) return; const n={id:'p'+newId(),kind:'plan',date:addDate,text:v,t:stamp()}; plan.push(n); commitPlan([n],[]); $('#noteIn').value=''; toast('Notiz hinzugefügt.'); return; }
  const pd=t.closest('[data-pday]'); if(pd && planFor){ addToPlan(planFor.r,pd.dataset.pday,planFor.por); closeSheet(); toast('Geplant für '+dayName(pd.dataset.pday),'#woche','Zum Plan'); return; }
  if(ctx.startsWith('more:')){
    const en=plan.find(x=>x.id===ctx.slice(5)); if(!en) return;
    const p=t.closest('[data-por]'); if(p){ en.por=Math.max(1,en.por+ +p.dataset.por); const r=recOf(en); $('#por').textContent=en.por+' '+(r&&r.unit||'Portionen'); commitPlan([en],[]); return; }
    const mv=t.closest('[data-move]'); if(mv){ en.date=mv.dataset.move; commitPlan([en],[]); closeSheet(); toast('Verschoben auf '+dayName(en.date)); return; }
    if(t.closest('[data-del]')){ plan=plan.filter(x=>x!==en); commitPlan([],[en]); closeSheet(); toast('Aus dem Plan entfernt.'); return; }
    if(t.closest('[data-unbuy]')){ en.bought=false; commitPlan([en],[]); closeSheet(); return; }
    if(t.closest('[data-openr]')){ const r=recOf(en); closeSheet(); planPor={rid:r.id,por:en.por}; location.hash=r.id; return; }
  }
  const ws=t.closest('[data-wsel]'); if(ws){ wSel=ws.dataset.wsel==='all'?new Set(wRows.map((_,i)=>i)):new Set(); document.querySelectorAll('#bs .ing input').forEach(c=>c.checked=wSel.has(+c.dataset.wi)); updW(); return; }
  if(t.closest('#wAdd')){
    const changed=new Set(); let n=0;
    wSel.forEach(i=>{ const row=wRows[i]; row.parts.forEach(p=>{ changed.add(addPart(p.name,p.u,p.v,p.a,p.r)); }); n++; });
    wEntries.forEach(en=>en.bought=true);
    commit([...changed],[]); commitPlan(wEntries,[]);
    closeSheet(); toast(n+(n===1?' Zutat':' Zutaten')+' hinzugefügt','#einkauf'); return;
  }
});
$('#bs').addEventListener('change',e=>{ const c=e.target; if(!c.matches('[data-wi]')) return; c.checked?wSel.add(+c.dataset.wi):wSel.delete(+c.dataset.wi); updW(); });
$('#bs').addEventListener('keydown',e=>{ if(e.target.id==='noteIn'&&e.key==='Enter'){ e.preventDefault(); $('#noteAdd').click(); } });
cleanPlan();

/* ---------- Timer ---------- */
let timers=[]; try{ timers=JSON.parse(localStorage.getItem('rz-timer')||'[]'); }catch(e){}
let actx=null, tick=null, lastBeep=0;
function saveTimers(){ try{ localStorage.setItem('rz-timer',JSON.stringify(timers)); }catch(e){} }
function fmtT(ms){ const s=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); }
function startTimer(sec,title,si){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}   // Ton freischalten (braucht einen Tipp)
  timers.push({id:newId(),end:Date.now()+sec*1000,label:'Schritt '+(si+1)+' · '+title.replace(/ (mit|und|in|an|auf) .*/,''),sec:sec});
  saveTimers(); renderTimers(); toast('Timer läuft: '+fmtT(sec*1000));
  if(!wakeOn) toggleWake(true);
}
function beep(){ if(!actx) return; try{ const t=actx.currentTime;
  [0,.25,.5].forEach(d=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,t+d); g.gain.exponentialRampToValueAtTime(.4,t+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d+.2); o.start(t+d); o.stop(t+d+.22); }); }catch(e){} }
let tSig='';
function renderTimers(){
  const now=Date.now();
  // Nur neu aufbauen, wenn sich Timer oder ihr Zustand ändern; sonst nur die Zeit aktualisieren (Knöpfe bleiben antippbar)
  const sig=timers.map(t=>t.id+(t.end<=now?'!':'')).join(',');
  if(sig!==tSig){ tSig=sig;
    $('#tbar').innerHTML=timers.map(t=>{ const ring=t.end<=now;
      return '<div class="tm'+(ring?' ring':'')+'" data-id="'+t.id+'"><span class="tl">'+(ring?'Fertig! ':'')+esc(t.label)+'</span><span class="tt"></span>'+
        (ring?'':'<button type="button" data-t="plus" aria-label="1 Minute dazu">+1</button>')+'<button type="button" data-t="stop" aria-label="Timer beenden">'+(ring?'OK':'✕')+'</button></div>'; }).join('');
  }
  timers.forEach(t=>{ const el=document.querySelector('.tm[data-id="'+t.id+'"] .tt'); if(el) el.textContent = t.end<=now ? '0:00' : fmtT(t.end-now); });
  if(timers.some(t=>t.end<=now) && now-lastBeep>1400){ lastBeep=now; beep(); try{ navigator.vibrate&&navigator.vibrate([300,150,300]); }catch(e){} }
  document.body.style.paddingBottom = timers.length ? 'calc('+(64+timers.length*58)+'px + env(safe-area-inset-bottom,0px))' : '';
  if(timers.length && !tick) tick=setInterval(renderTimers,500);
  if(!timers.length && tick){ clearInterval(tick); tick=null; }
}
$('#tbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-t]'); if(!b) return; const id=b.closest('.tm').dataset.id, t=timers.find(x=>x.id===id); if(!t) return;
  if(b.dataset.t==='plus') t.end+=60000; else timers=timers.filter(x=>x!==t);
  saveTimers(); renderTimers();
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') renderTimers(); });

let toastT=null;
function toast(msg,link,linkText){
  const t=$('#toast'); t.innerHTML='<span>'+esc(msg)+'</span>'+(link?'<a href="'+link+'">'+(linkText||'Zur Liste')+'</a>':''); t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500);
}
$('#toast').addEventListener('click',e=>{ if(e.target.closest('a')) $('#toast').hidden=true; });

/* ---------- Navigation ---------- */
// Merkt sich den Weg innerhalb der App, damit „Zurück“ nie aus der App hinausführt
const trail=[location.hash];
function goBack(){ if(trail.length>1) history.back(); else location.hash=''; }
function updateNav(){
  const v = !$('#shop').hidden ? 'einkauf' : !$('#week').hidden ? 'woche' : (!$('#home').hidden && cat===FAV ? 'favoriten' : 'rezepte');
  document.querySelectorAll('.bnav button').forEach(b=>{ if(b.dataset.nav===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
}
document.querySelector('.bnav').addEventListener('click',e=>{
  const b=e.target.closest('[data-nav]'); if(!b) return; const v=b.dataset.nav;
  if(!$('#cook').hidden) closeCook();
  if(v==='einkauf'){ if(location.hash!=='#einkauf') location.hash='einkauf'; return; }
  if(v==='woche'){ if(location.hash!=='#woche') location.hash='woche'; else { wkStart=monday(new Date()); renderWeek(); window.scrollTo(0,0); } return; }
  const want = v==='favoriten' ? FAV : (cat===FAV ? 'Alle' : cat);
  const onHome = !location.hash || location.hash==='#';
  if(want!==cat || v==='rezepte') setCat(want);
  if(onHome){ route(); window.scrollTo(0,0); } else location.hash='';
});
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  $('#toast').hidden=true;
  if(!$('#cook').hidden) closeCook();
  closeSheet();
  const r=R.find(x=>x.id===id);
  $('#home').hidden=$('#detail').hidden=$('#shop').hidden=$('#week').hidden=true;
  if(id==='einkauf'){ cur=null; editId=null; confirmClear=false; shareFallback=''; renderShop(); $('#shop').hidden=false; window.scrollTo(0,0); }
  else if(id==='woche'){ cur=null; renderWeek(); $('#week').hidden=false; window.scrollTo(0,0); }
  else if(r){ renderDetail(r); $('#detail').hidden=false; window.scrollTo(0,0); }
  else { cur=null; renderTabs(); renderList(); $('#home').hidden=false; }
  updateCartCount(); updateNav();
}
window.addEventListener('hashchange',()=>{
  const h=location.hash;
  if(trail.length>1 && trail[trail.length-2]===h) trail.pop(); else trail.push(h);
  if(!h || h==='#') trail.length=1, trail[0]=h;
  route();
});
window.addEventListener('storage',e=>{ if(e.key===PK && !listId){ try{ plan=JSON.parse(e.newValue)||plan; }catch(_){} if(!$('#week').hidden) renderWeek(); }
  if(e.key===SK && !listId){ try{ shop=JSON.parse(e.newValue)||shop; }catch(_){} route(); } });
renderTabs(); renderList(); route(); renderTimers();
if(FB){
  if(pendingJoin && pendingJoin!==listId){ const fresh=!listId; connect(pendingJoin,fresh); toast('Mit der gemeinsamen Liste verbunden.'); }
  else if(listId) connect(listId,false);
}
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
