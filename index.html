<script>
// Zeigt Fehler direkt auf der Seite an (hilft bei der Fehlersuche auf dem Handy)
window.addEventListener('error', function (e) {
  var t = e.target && e.target !== window && (e.target.src || e.target.href);
  if (t && String(t).indexOf(location.origin) !== 0) return; // fremde Dateien (Schriften) ignorieren
  var msg = t ? 'Datei konnte nicht geladen werden: ' + String(t).split('/').pop()
              : 'Fehler: ' + (e.message || '?') + ' (Zeile ' + (e.lineno || '?') + ')';
  var d = document.getElementById('err');
  if (!d) { d = document.createElement('div'); d.id = 'err';
    d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#B3261E;color:#fff;padding:10px 12px;border-radius:10px;font:14px/1.4 system-ui,sans-serif';
    (document.body || document.documentElement).appendChild(d); }
  d.textContent = msg;
}, true);

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600;700&family=Montserrat:wght@700&display=swap">
<style>
:root{
  --paper:#F3F5F2; --sheet:#FFFFFF; --ink:#23262D; --muted:#5F6571;
  --pen:#26358C; --pen-soft:#E6E9F6; --leaf:#557257; --rule:#C9CEDA; --done:#9AA0AC;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10131A; --sheet:#191D27; --ink:#E6E8EE; --muted:#9CA2AF;
    --pen:#A7B5FF; --pen-soft:#232A46; --leaf:#8DB08E; --rule:#343A4B; --done:#646A78;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10131A; --sheet:#191D27; --ink:#E6E8EE; --muted:#9CA2AF;
  --pen:#A7B5FF; --pen-soft:#232A46; --leaf:#8DB08E; --rule:#343A4B; --done:#646A78;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);margin:0;-webkit-text-size-adjust:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
body.noscroll{overflow:hidden}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:8px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
.lbl{font:700 .7rem/1.2 var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Kopf */
.head{display:flex;align-items:flex-end;gap:12px;padding-top:18px}
.head h1{font:700 3rem/1 var(--hand);color:var(--pen);margin:0;text-wrap:balance}
.head svg{width:74px;height:30px;flex:none;color:var(--leaf);margin-bottom:8px}
.count{margin:4px 0 18px;color:var(--muted);font-size:.95rem}
.search{position:relative;margin-bottom:16px}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px 12px 42px;border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--pen)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

/* Registerreiter */
.tabs{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1.5px solid var(--rule);margin-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--rule);border-bottom:none;border-radius:10px 10px 0 0;background:transparent;padding:8px 14px 6px;font:700 .72rem/1.2 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-bottom:-1.5px}
.tab[aria-pressed="true"]{background:var(--sheet);color:var(--pen);border-color:var(--rule);border-bottom:1.5px solid var(--sheet)}

/* Liste */
.group{margin-top:22px}
.group>.lbl{margin:0 0 4px 2px}
.list{list-style:none;margin:0;padding:0 16px;background:var(--sheet);border-radius:14px;border:1px solid var(--rule)}
.list li+li{border-top:1.5px dotted var(--rule)}
.row{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 0;cursor:pointer}
.row .t{font:700 1.75rem/1.1 var(--hand);color:var(--pen)}
.row .t.long{font-size:1.35rem;line-height:1.15}
.row .fav{color:#C2415B;margin-left:6px;font-family:var(--body);font-size:.95rem;vertical-align:middle}
.recent{margin:4px 0 6px}
.recent .chips{margin:6px 0 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.recent .chips::-webkit-scrollbar{display:none}
.rchip{flex:none;border:1.5px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 12px;font-size:.88rem;cursor:pointer;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:4px;font-size:.88rem;color:var(--muted)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.on{background:var(--pen);border-color:var(--pen)}
.tag{font:700 .64rem/1 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);border:1.5px solid currentColor;border-radius:99px;padding:4px 7px 3px}
.empty{padding:28px 4px;color:var(--muted)}

/* Rezept */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--rule)}
.btn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:99px;padding:7px 14px;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);font-weight:700}
.back{border:0;background:none;padding:7px 0;color:var(--pen);font-weight:700;cursor:pointer}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:20px 18px 26px;margin-top:16px}
.rtitle{font:700 2.7rem/1.02 var(--hand);color:var(--pen);margin:6px 0 14px;text-wrap:balance}
.rtitle.long{font-size:2rem;line-height:1.08}
.favbtn[aria-pressed="true"]{border-color:#C2415B;background:transparent;color:#C2415B}
.stephead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stephead h2{margin-bottom:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;padding:14px 0;border-block:1.5px dotted var(--rule)}
.facts div{display:flex;flex-direction:column;gap:4px}
.facts b{font-weight:700;font-size:1rem}
.scale{display:flex;align-items:center;gap:12px;margin:18px 0 4px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--rule);border-radius:99px;overflow:hidden}
.step button{border:0;background:none;width:42px;height:40px;font-size:1.3rem;cursor:pointer;color:var(--pen)}
.step button:disabled{color:var(--done);cursor:default}
.step output{min-width:108px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.reset{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem}
.cols{display:grid;gap:8px 40px;margin-top:10px}
@media (min-width:760px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.cols h2{font:700 2.1rem/1 var(--hand);margin:18px 0 6px;color:var(--ink)}
.cols h3{margin:16px 0 2px}
.ing{list-style:none;margin:0;padding:0}
.ing li{border-bottom:1.5px dotted var(--rule)}
.ing label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
.ing input{appearance:none;flex:none;width:20px;height:20px;margin-top:3px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;cursor:pointer;background:var(--sheet)}
.ing input:checked{background:var(--pen);border-color:var(--pen)}
.ing input:checked::after{content:"";width:5px;height:10px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ing:not(.picking) input:checked+span{color:var(--done);text-decoration:line-through}
.picking input:checked{background:var(--leaf);border-color:var(--leaf)}
.picking li.basic{color:var(--done)}
.picking li.basic input{opacity:.35;cursor:default}
.picking li.basic label{cursor:default}
.picking small{color:var(--muted);font-size:.8rem}
.pickhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;background:var(--pen-soft);border-radius:10px;padding:8px 12px;margin:4px 0 6px;font-weight:700;color:var(--pen)}
.linkbtn{border:0;background:none;color:var(--pen);text-decoration:underline;cursor:pointer;padding:4px 2px;font-weight:400}
.pickbar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:nowrap;margin-top:12px;padding:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:4}
.pickbar .btn{padding:9px 12px;white-space:nowrap}
.pickbar .primary{flex:1;justify-content:center}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--sheet);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.q{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;border-bottom:1.5px dotted var(--rule);cursor:pointer}
.steps li::before{content:counter(s);width:30px;height:30px;border:1.5px solid var(--pen);color:var(--pen);border-radius:50%;display:grid;place-items:center;font:700 1.25rem/1 var(--hand)}
.steps li.done{color:var(--done)}
.steps li.done::before{background:var(--pen-soft);border-color:var(--done);color:var(--done)}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.notes{margin-top:26px;border:1.5px solid var(--ink);border-radius:4px;padding:10px 14px 12px;position:relative}
.notes .nh{font:700 1.7rem/1 var(--hand);background:var(--sheet);padding:0 6px;position:absolute;top:-.8rem;left:12px}
.notes p{margin:10px 0 0}
.foot{margin-top:28px;color:var(--muted);font-size:.85rem;text-align:center}

/* Einkaufsliste */
.subrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:4px 0 18px}
.subrow .count{margin:0}
a.btn{text-decoration:none;color:var(--ink)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--pen);color:var(--sheet);font:700 .78rem/22px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.badge:empty{display:none}
.barR{display:flex;gap:6px;align-items:center}
.cartadd{margin-top:14px}
.addnote{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.stitle{font:700 2.7rem/1.02 var(--hand);color:var(--pen);margin:0 0 4px}
.sstat{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.addform{display:flex;gap:8px;margin-bottom:14px}
.addform input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink)}
.addform input:focus{outline:none;border-color:var(--pen)}
.addform button{flex:none;border:0;border-radius:10px;background:var(--pen);color:var(--sheet);font-weight:700;padding:0 16px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{max-width:100%;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:99px;padding:3px 4px 3px 10px;font-size:.85rem;background:var(--paper)}
.chip .cht{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip button{flex:none;border:0;background:none;cursor:pointer;color:var(--muted);width:24px;height:24px;border-radius:50%}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;align-items:center;gap:4px 8px;border-bottom:1.5px dotted var(--rule);min-height:52px}
.chk{width:24px;height:24px;border:1.5px solid var(--muted);border-radius:6px;background:var(--sheet);cursor:pointer;display:grid;place-items:center;padding:0}
.done .chk{background:var(--pen);border-color:var(--pen)}
.done .chk::after{content:"";width:6px;height:11px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it{border:0;background:none;text-align:left;padding:8px 0;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.it small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .it .txt{color:var(--done);text-decoration:line-through}
.ic{border:0;background:none;width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:1rem}
.ic:hover{background:var(--pen-soft);color:var(--pen)}
.edit-in{width:100%;font:inherit;padding:6px 8px;border:1.5px solid var(--pen);border-radius:8px;background:var(--sheet);color:var(--ink)}
.shop li.editing{grid-template-columns:minmax(0,1fr) auto;padding:6px 0}
.editbox{display:flex;flex-direction:column;gap:6px}
.dhead{margin:20px 0 2px}
.sactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.btn.warn{border-color:#B3261E;color:#B3261E}
.sempty{color:var(--muted);padding:18px 0 6px}
#sharetxt{width:100%;min-height:140px;margin-top:12px;font:inherit;font-size:.9rem;border:1.5px solid var(--rule);border-radius:10px;padding:10px;background:var(--sheet);color:var(--ink)}
.sharebox{margin-top:26px;padding:14px;border:1.5px dashed var(--rule);border-radius:12px}
.sharebox p{margin:6px 0 10px;font-size:.92rem;color:var(--muted)}
.sharebox .small{font-size:.85rem}
.sharebox details{margin-top:12px}
.sharebox summary{cursor:pointer;color:var(--pen);font-weight:700}
.syncline{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);margin:-8px 0 14px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--done);flex:none}
.s-online .sdot{background:var(--leaf)}
.s-offline .sdot{background:#C48A1A}
.s-error .sdot{background:#B3261E}
.toast{width:max-content;min-width:min(320px,calc(100% - 32px));justify-content:space-between;position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:.95rem}
.toast a{color:var(--paper);font-weight:700;white-space:nowrap}
/* Navigation unten */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{flex:1;max-width:200px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;color:var(--muted);font:700 .72rem/1.2 var(--label);letter-spacing:.06em;text-transform:uppercase;position:relative}
.bnav svg{width:24px;height:24px}
.bnav button[aria-current="page"]{color:var(--pen)}
.bnav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:.7rem;line-height:18px;padding:0 5px}
/* Kochmodus */
#cook{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
#cook[hidden]{display:none}
.ck-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ck-top .btn{white-space:nowrap;padding:7px 12px}
.ck-top .lbl{white-space:nowrap}
.ck-prog{height:4px;background:var(--rule);border-radius:4px;margin:10px 0 0;overflow:hidden}
.ck-prog i{display:block;height:100%;background:var(--pen);transition:width .2s}
.ck-body{flex:1;overflow-y:auto;padding:18px 2px;max-width:760px;width:100%;margin:0 auto;touch-action:pan-y}
.ck-title{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.ck-num{font:700 3.2rem/1 var(--hand);color:var(--pen);margin-bottom:8px}
.ck-step{font-size:clamp(1.35rem,5.2vw,2rem);line-height:1.4;margin:0;text-wrap:pretty}
.ck-ings{margin-top:22px;border-top:1.5px dotted var(--rule);padding-top:10px}
.ck-ings ul{list-style:none;padding:0;margin:4px 0 0}
.ck-ings li{padding:5px 0;border-bottom:1.5px dotted var(--rule)}
.ck-nav{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto}
.ck-nav button{flex:1;min-height:56px;border-radius:14px;font-size:1.1rem;justify-content:center}
@media (prefers-reduced-motion:no-preference){.row,.btn,.tab{transition:background-color .15s,color .15s}}
</style>

</head>
<body>
<div class="wrap">
  <main id="home">
    <div class="head">
      <h1>Rezeptordner</h1>
      <svg viewBox="0 0 74 30" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 20 Q36 16 72 12"/><path d="M14 19c-3-7 1-12 6-13 1 6-2 10-6 13Z"/><path d="M14 19c4 6 10 7 13 6-3-5-8-7-13-6Z"/><path d="M30 17c-3-7 1-12 6-13 1 6-2 10-6 13Z"/><path d="M30 17c4 6 10 7 13 6-3-5-8-7-13-6Z"/><path d="M46 15c-3-7 1-12 6-13 1 6-2 10-6 13Z"/><path d="M46 15c4 6 10 7 13 6-3-5-8-7-13-6Z"/></svg>
    </div>
    <p class="count" id="count"></p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Rezept oder Zutat suchen …" autocomplete="off" aria-label="Rezept oder Zutat suchen">
    </div>
    <nav class="tabs" id="tabs" aria-label="Kategorien"></nav>
    <div id="recent"></div>
    <div id="groups"></div>
  </main>
  <article id="detail" hidden></article>
  <section id="shop" hidden></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="cook" hidden role="dialog" aria-modal="true" aria-label="Kochmodus"></div>
<nav class="bnav" aria-label="Hauptnavigation">
  <button type="button" data-nav="rezepte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>Rezepte</button>
  <button type="button" data-nav="favoriten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>Favoriten</button>
  <button type="button" data-nav="einkauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.3"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Einkauf<span class="badge" data-cartn></span></button>
</nav>

<script src="rezepte.js"></script>
<script>
(function(){
const dataEl=document.getElementById('data');
const R = window.REZEPTE || (dataEl ? JSON.parse(dataEl.textContent) : null);
if(!R){ document.getElementById('groups').innerHTML='<p class="empty">Die Rezepte konnten nicht geladen werden. Bitte mit Internet neu öffnen.</p>'; return; }
const ORDER = ['Frühstück','Salat','Pasta & Nudeln','Pfanne & Wok','Curry & Eintopf','Bowls & Teller','Burger & Wraps','Aus dem Ofen','Saucen','Backen','Snacks'];
const cats = [...new Set(R.map(r=>r.cat))].sort((a,b)=>(ORDER.indexOf(a)+99)%99 - (ORDER.indexOf(b)+99)%99 || a.localeCompare(b));
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat = 'Alle';
const FAV='Favoriten';
try{ cat = localStorage.getItem('rz-cat') || 'Alle'; if(cat!=='Alle' && cat!==FAV && !cats.includes(cat)) cat='Alle'; }catch(e){}
function loadSet(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }
function saveArr(k,a){ try{ localStorage.setItem(k,JSON.stringify(a)); }catch(e){} }
let favs=new Set(loadSet('rz-favs')), recent=loadSet('rz-recent').filter(id=>R.some(r=>r.id===id));
function toggleFav(id){ favs.has(id)?favs.delete(id):favs.add(id); saveArr('rz-favs',[...favs]); }
function pushRecent(id){ recent=[id,...recent.filter(x=>x!==id)].slice(0,8); saveArr('rz-recent',recent); }
function setCat(c){ cat=c; try{localStorage.setItem('rz-cat',cat)}catch(_){} renderTabs(); renderList(); }

/* Suche: unempfindlich gegen Umlaute, doppelte Buchstaben und kleine Tippfehler */
function norm(s){ return String(s).toLowerCase().replace(/ä|ae/g,'a').replace(/ö|oe/g,'o').replace(/ü|ue/g,'u').replace(/ß/g,'s')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/([a-z])\1+/g,'$1'); }
function lev(a,b){ if(Math.abs(a.length-b.length)>1) return 2; let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ const c=[i]; for(let j=1;j<=b.length;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[b.length]; }
const IDX=new Map(R.map(r=>{ const h=norm([r.title,r.cat,...r.tags,...r.groups.flatMap(g=>[g.title||'',...g.items.map(i=>i.t)])].join(' ')); return [r.id,{h:' '+h+' ',tok:[...new Set(h.split(' ').filter(Boolean))]}]; }));
function matches(r,words){ const x=IDX.get(r.id);
  return words.every(w=> x.h.includes(w) || (w.length>=4 && x.tok.some(t=> lev(t.slice(0,w.length),w)<=1 || lev(t,w)<=1))); }

/* ---------- Mengen ---------- */
const FR = {0.25:'¼',0.5:'½',0.75:'¾'};
function num(n,u){
  if(['g','ml'].includes(u)){
    if(n>=100) return String(Math.round(n/5)*5);
    if(n>=10) return String(Math.round(n));
    n = Math.round(n*2)/2; return String(n).replace('.',',');
  }
  const q = Math.round(n*4)/4;
  if(q===0) return '¼';
  const w = Math.floor(q), f = +(q-w).toFixed(2);
  return (w? String(w):'') + (FR[f]||'');
}
function qty(it,f){
  if(it.m==null) return '';
  const u = it.u||'';
  const v = Array.isArray(it.m) ? it.m.map(x=>num(x*f,u)).join('–') : num(it.m*f,u);
  return (it.ca?'ca. ':'') + v + (u?' '+u:'');
}
function dots(n){ if(!n) return ''; let h='<span class="dots" aria-label="Schwierigkeit '+n+' von 5">'; for(let i=1;i<=5;i++) h+='<i class="'+(i<=n?'on':'')+'"></i>'; return h+'</span>'; }
function yieldText(r){ return r.servings ? r.servings+' '+r.unit : ''; }

/* ---------- Übersicht ---------- */
function renderTabs(){
  $('#tabs').innerHTML = ['Alle',FAV,...cats].map(c=>'<button class="tab" type="button" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+(c===FAV?'♥ ':'')+esc(c)+'</button>').join('');
}
function renderRecent(show){
  const list=recent.map(id=>R.find(r=>r.id===id)).filter(Boolean);
  $('#recent').innerHTML = show && list.length ? '<div class="recent"><div class="lbl">Zuletzt angesehen</div><div class="chips">'+
    list.map(r=>'<button class="rchip" type="button" data-id="'+r.id+'">'+esc(r.title)+'</button>').join('')+'</div></div>' : '';
}
function renderList(){
  const q = $('#q').value.trim(), words = norm(q).split(' ').filter(Boolean);
  const hits = R.filter(r=>(cat==='Alle'||r.cat===cat||(cat===FAV&&favs.has(r.id))) && (!words.length || matches(r,words)));
  $('#count').textContent = R.length+' Rezepte in '+cats.length+' Kategorien';
  renderRecent(cat==='Alle' && !words.length);
  if(!hits.length){ $('#groups').innerHTML='<p class="empty">'+(cat===FAV && !words.length ? 'Noch keine Favoriten. Öffne ein Rezept und tippe oben auf das Herz ♡.' : 'Kein Rezept passt zu „'+esc(q)+'“'+(cat!=='Alle'?' in „'+esc(cat)+'“':'')+'. Versuch es mit einer Zutat, z. B. „Pilze“.')+'</p>'; return; }
  $('#groups').innerHTML = cats.filter(c=>hits.some(r=>r.cat===c)).map(c=>
    '<section class="group"><h2 class="lbl">'+esc(c)+'</h2><ul class="list">'+
    hits.filter(r=>r.cat===c).sort((a,b)=>a.title.localeCompare(b.title,'de')).map(r=>{
      const m = [dots(r.difficulty), r.time?'<span>⏱ '+esc(r.time)+'</span>':'', yieldText(r)?'<span>'+esc(yieldText(r))+'</span>':'', ...r.tags.map(t=>'<span class="tag">'+esc(t)+'</span>')].filter(Boolean).join('');
      return '<li><button class="row" type="button" data-id="'+r.id+'"><div class="t'+(r.title.length>38?' long':'')+'">'+esc(r.title)+(favs.has(r.id)?'<span class="fav" aria-label="Favorit">♥</span>':'')+'</div>'+(m?'<div class="meta">'+m+'</div>':'')+'</button></li>';
    }).join('')+'</ul></section>').join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(!b) return; setCat(b.dataset.c); updateNav();});
$('#recent').addEventListener('click',e=>{const b=e.target.closest('.rchip'); if(b) location.hash=b.dataset.id;});
$('#q').addEventListener('input',renderList);
$('#groups').addEventListener('click',e=>{const b=e.target.closest('.row'); if(b) location.hash=b.dataset.id;});

/* ---------- Rezeptansicht ---------- */
const FACTORS=[0.5,1,1.5,2,3,4];
let cur=null, amount=1, cooked=new Set(), pick=null;
function stepSize(r){ return r.servings>=10 ? 5 : 1; }
function amountLabel(r){ return r.servings ? amount+' '+r.unit : (amount===1?'1× Rezept':String(amount).replace('.',',')+'× Rezept'); }
function factor(r){ return r.servings ? amount/r.servings : amount; }
function renderDetail(r){
  cur=r; amount = r.servings || 1; cooked=new Set(); pick=null; pushRecent(r.id);
  const facts = [
    r.difficulty?['Schwierigkeit',dots(r.difficulty)]:null,
    r.prep?['Vorbereitung',esc(r.prep)]:null,
    r.time?['Zeit',esc(r.time)]:null,
  ].filter(Boolean);
  $('#detail').innerHTML =
    '<div class="bar"><button class="back" type="button" id="back">‹ Rezepte</button>'+
    '<div class="barR"><button class="btn" type="button" id="wake" aria-pressed="'+wakeOn+'">☀ Bildschirm an</button>'+
    '<button class="btn favbtn" type="button" id="favBtn" aria-pressed="'+favs.has(r.id)+'" aria-label="Als Favorit merken">'+(favs.has(r.id)?'♥':'♡')+'</button></div></div>'+
    '<div class="sheet"><div class="lbl">'+esc(r.cat)+(r.tags.length?' · '+r.tags.map(esc).join(' · '):'')+'</div>'+
    '<h1 class="rtitle'+(r.title.length>45?' long':'')+'">'+esc(r.title)+'</h1>'+
    (facts.length?'<div class="facts">'+facts.map(f=>'<div><span class="lbl">'+f[0]+'</span><b>'+f[1]+'</b></div>').join('')+'</div>':'')+
    '<div class="scale"><span class="lbl">'+(r.servings?'Menge':'Rezeptmenge')+'</span><div class="step"><button type="button" id="minus" aria-label="weniger">−</button><output id="amt"></output><button type="button" id="plus" aria-label="mehr">+</button></div><button class="reset" type="button" id="reset" hidden>zurücksetzen</button></div>'+
    '<div class="cols"><section><h2>Zutaten</h2><div id="ings"></div>'+
    '<button class="btn cartadd" type="button" id="toCart"></button>'+
    '<p class="addnote" id="addnote" hidden></p></section>'+
    '<section><div class="stephead"><h2>Zubereitung</h2><button class="btn primary" type="button" id="cookBtn">▶ Jetzt kochen</button></div><ol class="steps" id="steps">'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol><p class="hint">Tipp: Schritt antippen, um ihn abzuhaken.</p>'+
    (r.notes.length?'<div class="notes"><span class="nh">Notizen</span>'+r.notes.map(n=>'<p>'+esc(n)+'</p>').join('')+'</div>':'')+
    '</section></div></div>';
  renderIngs(); renderCartBtn();
}
function renderCartBtn(){
  const on = cur && shop.items.some(i=>i.parts.some(p=>p.rid===cur.id));
  $('#toCart').textContent = on ? '🛒 Nochmal zur Einkaufsliste' : '🛒 Zur Einkaufsliste';
  $('#addnote').textContent = on ? 'Dieses Rezept steht schon auf der Liste. Nochmal hinzufügen zählt die Mengen dazu.' : '';
  $('#toCart').hidden = pick!=null; $('#addnote').hidden = pick!=null || !on;
}
function renderIngs(){
  const r=cur, f=factor(r);
  $('#amt').textContent = amountLabel(r);
  $('#minus').disabled = r.servings ? amount-stepSize(r)<1 : amount<=FACTORS[0];
  $('#plus').disabled = !r.servings && amount>=FACTORS[FACTORS.length-1];
  $('#reset').hidden = amount === (r.servings||1);
  let k=0; const picking = pick!=null;
  $('#ings').innerHTML =
    (picking?'<div class="pickhead"><span>Was musst du kaufen?</span><span><button class="linkbtn" type="button" data-pick="all">Alle</button> · <button class="linkbtn" type="button" data-pick="none">Keine</button></span></div>':'')+
    r.groups.map(g=>(g.title?'<h3 class="lbl">'+esc(g.title)+'</h3>':'')+'<ul class="ing'+(picking?' picking':'')+'">'+
    g.items.map(it=>{
      const idx=k++, id='i'+idx, q=qty(it,f), basic=picking && itemBasic(it);
      const on = picking ? pick.has(idx) : cooked.has(idx);
      return '<li'+(basic?' class="basic"':'')+'><label for="'+id+'"><input type="checkbox" id="'+id+'" data-i="'+idx+'"'+(on?' checked':'')+(basic?' disabled':'')+'><span>'+(q?'<span class="q">'+esc(q)+'</span> ':'')+esc(it.t)+(basic?' <small>· hast du meist da</small>':'')+'</span></label></li>';
    }).join('')+'</ul>').join('')+
    (picking?'<div class="pickbar"><button class="btn primary" type="button" id="pickAdd"></button><button class="btn" type="button" id="pickCancel">Abbrechen</button></div>':'');
  if(picking) updatePickBar();
  renderCartBtn();
}
function itemBasic(it){ const names = it.m==null ? it.t.split(',') : [it.t.split(',')[0]]; return names.every(n=>isBasic(n.trim())); }
function selectable(){ let k=0, out=[]; cur.groups.forEach(g=>g.items.forEach(it=>{ const i=k++; if(!itemBasic(it)) out.push(i); })); return out; }
function updatePickBar(){ const n=pick.size, b=$('#pickAdd'); b.disabled=!n; b.textContent = n ? n+(n===1?' Zutat':' Zutaten')+' hinzufügen' : 'Zutaten auswählen'; }
$('#detail').addEventListener('change',e=>{
  const c=e.target; if(!c.matches('.ing input')) return;
  const i=+c.dataset.i, set = pick!=null ? pick : cooked;
  if(c.checked) set.add(i); else set.delete(i);
  if(pick!=null) updatePickBar();
});
$('#detail').addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#back')){ goBack(); return; }
  if(t.closest('#wake')){ toggleWake(); return; }
  const r=cur; if(!r) return;
  if(t.closest('#favBtn')){ toggleFav(r.id); const b=$('#favBtn'); b.setAttribute('aria-pressed',favs.has(r.id)); b.textContent=favs.has(r.id)?'♥':'♡';
    toast(favs.has(r.id)?'Zu den Favoriten hinzugefügt.':'Aus den Favoriten entfernt.'); return; }
  if(t.closest('#cookBtn')){ openCook(); return; }
  if(t.closest('#toCart')){ pick=new Set(); renderIngs(); $('#ings').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(t.closest('#pickCancel')){ pick=null; renderIngs(); return; }
  const pb=t.closest('[data-pick]');
  if(pb){ pick = pb.dataset.pick==='all' ? new Set(selectable()) : new Set(); renderIngs(); return; }
  if(t.closest('#pickAdd')){
    if(!pick.size) return;
    const n=addRecipe(r,factor(r),pick); pick=null; renderIngs();
    toast(n+(n===1?' Zutat':' Zutaten')+' hinzugefügt','#einkauf');
    return;
  }
  if(t.closest('#minus')||t.closest('#plus')){
    const up=!!t.closest('#plus');
    if(r.servings){ amount=Math.max(stepSize(r), amount+(up?1:-1)*stepSize(r)); }
    else { const i=FACTORS.indexOf(amount); amount=FACTORS[Math.min(FACTORS.length-1,Math.max(0,i+(up?1:-1)))]; }
    renderIngs(); return;
  }
  if(t.closest('#reset')){ amount=r.servings||1; renderIngs(); return; }
  const li=t.closest('.steps li'); if(li) li.classList.toggle('done');
});

/* ---------- Bildschirm anlassen ---------- */
let wakeOn=false, lock=null;
async function acquire(){ try{ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release',()=>{lock=null}); return true; }catch(e){ return false; } }
async function toggleWake(){
  const b=$('#wake');
  if(wakeOn){ wakeOn=false; try{ lock && await lock.release(); }catch(e){} lock=null; }
  else { wakeOn = ('wakeLock' in navigator) && await acquire();
    if(!wakeOn && b){ b.textContent='Nicht verfügbar'; setTimeout(()=>{ if($('#wake')) $('#wake').textContent='☀ Bildschirm an'; },2200); } }
  if($('#wake')) $('#wake').setAttribute('aria-pressed',wakeOn);
  if(wakeOn) toast('Der Bildschirm bleibt an, solange das Rezept offen ist.');
  else if(b && b.textContent!=='Nicht verfügbar') toast('Der Bildschirm schaltet sich wieder normal ab.');
}
document.addEventListener('visibilitychange',()=>{ if(wakeOn && !lock && document.visibilityState==='visible') acquire(); });

/* ---------- Kochmodus ---------- */
let cookI=0, cookWake=false, cookIngs=false, tx=null;
async function openCook(){
  if(!cur) return; cookI=0; cookIngs=false; cookWake=wakeOn;
  renderCook(); $('#cook').hidden=false; document.body.classList.add('noscroll');
  if(!wakeOn){ wakeOn = ('wakeLock' in navigator) && await acquire(); if($('#wake')) $('#wake').setAttribute('aria-pressed',wakeOn); }
  $('#ckNext').focus();
}
async function closeCook(){
  $('#cook').hidden=true; document.body.classList.remove('noscroll');
  if(!cookWake && wakeOn){ wakeOn=false; try{ lock && await lock.release(); }catch(e){} lock=null; if($('#wake')) $('#wake').setAttribute('aria-pressed',false); }
}
function renderCook(){
  const r=cur, n=r.steps.length, last=cookI===n-1, f=factor(r);
  $('#cook').innerHTML=
    '<div class="ck-top"><button class="btn" type="button" id="ckClose" aria-label="Kochmodus schließen">✕</button><span class="lbl">Schritt '+(cookI+1)+' von '+n+'</span>'+
    '<button class="btn" type="button" id="ckIngs" aria-pressed="'+cookIngs+'">Zutaten</button></div>'+
    '<div class="ck-prog"><i style="width:'+Math.round((cookI+1)/n*100)+'%"></i></div>'+
    '<div class="ck-body" id="ckBody"><p class="ck-title">'+esc(r.title)+' · '+esc(amountLabel(r))+'</p>'+
    '<div class="ck-num">'+(cookI+1)+'</div><p class="ck-step">'+esc(r.steps[cookI])+'</p>'+
    (cookIngs?'<div class="ck-ings"><div class="lbl">Zutaten</div>'+r.groups.map(g=>(g.title?'<h3 class="lbl" style="margin:12px 0 0">'+esc(g.title)+'</h3>':'')+'<ul>'+g.items.map(it=>{const q=qty(it,f); return '<li>'+(q?'<b class="q">'+esc(q)+'</b> ':'')+esc(it.t)+'</li>';}).join('')+'</ul>').join('')+'</div>':'')+
    '</div>'+
    '<div class="ck-nav"><button class="btn" type="button" id="ckPrev"'+(cookI?'':' disabled')+'>‹ Zurück</button>'+
    '<button class="btn primary" type="button" id="ckNext">'+(last?'Fertig ✓':'Weiter ›')+'</button></div>';
}
function markStep(i){ const li=document.querySelectorAll('#steps li')[i]; if(li) li.classList.add('done'); }
function cookGo(d){
  const n=cur.steps.length;
  if(d>0 && cookI===n-1){ markStep(cookI); closeCook(); toast('Guten Appetit!'); return; }
  if(d>0) markStep(cookI);
  cookI=Math.max(0,Math.min(n-1,cookI+d)); renderCook();
}
$('#cook').addEventListener('click',e=>{
  if(e.target.closest('#ckClose')) closeCook();
  else if(e.target.closest('#ckNext')) cookGo(1);
  else if(e.target.closest('#ckPrev')) cookGo(-1);
  else if(e.target.closest('#ckIngs')){ cookIngs=!cookIngs; renderCook(); }
});
$('#cook').addEventListener('touchstart',e=>{ tx=e.touches.length===1?[e.touches[0].clientX,e.touches[0].clientY]:null; },{passive:true});
$('#cook').addEventListener('touchend',e=>{ if(!tx) return; const dx=e.changedTouches[0].clientX-tx[0], dy=e.changedTouches[0].clientY-tx[1]; tx=null;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) cookGo(dx<0?1:-1); });
document.addEventListener('keydown',e=>{ if($('#cook').hidden) return;
  if(e.key==='ArrowRight') cookGo(1); else if(e.key==='ArrowLeft') cookGo(-1); else if(e.key==='Escape') closeCook(); });

/* ---------- Einkaufsliste ---------- */
const SK='rz-einkauf-v1', LK='rz-liste-id';
const FB = window.FIREBASE_CONFIG || null;   // nur in der GitHub-Fassung gesetzt
let shop={items:[]};
try{ const s=JSON.parse(localStorage.getItem(SK)||'null'); if(s && Array.isArray(s.items)) shop=s; }catch(e){}
shop.items.forEach((i,k)=>{ i.id=String(i.id); if(i.t==null) i.t=k; });
let listId=null; try{ listId=FB && localStorage.getItem(LK); }catch(e){}
let sync={state:'local'};               // local | connecting | online | offline | error
let db=null, unsub=null, tSeq=0;

function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function stamp(){ return Date.now()*1000+(tSeq++%1000); }
function randomListId(){ const a=new Uint8Array(24); crypto.getRandomValues(a); return Array.from(a,x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join(''); }
function saveLocal(){ try{ localStorage.setItem(SK,JSON.stringify(shop)); }catch(e){} updateCartCount(); }
function updateCartCount(){ const n=shop.items.filter(i=>!i.done).length; document.querySelectorAll('[data-cartn]').forEach(el=>el.textContent=n||''); }
function plain(it){ const o={name:it.name,u:it.u||'',parts:it.parts||[],done:!!it.done,t:it.t||stamp()}; if(it.text!=null) o.text=it.text; if(it.custom) o.custom=true; if(it.sec) o.sec=it.sec; return o; }

/* Supermarkt-Bereiche: automatisch nach Zutatennamen, pro Eintrag änderbar */
const SECS=['Obst & Gemüse','Kühlregal','Brot & Backwaren','Nudeln, Reis & Getreide','Konserven & Gläser','Backen & Süßes','Gewürze, Öl & Saucen','Nüsse & Samen','Tiefkühl','Getränke','Sonstiges'];
const SEC_RULES=[
  ['Tiefkühl',/\btk\b|tk-|tiefgek/],
  ['Getränke',/wein\b|rotwein|weißwein|mineralwasser|saft\b(?!.*zitrone|.*limette)/],
  ['Gewürze, Öl & Saucen',/öl\b|öl$|essig/],
  ['Nüsse & Samen',/nuss|nüsse|mandel|cashew|erdnuss|pistazie|sesam|chia|leinsamen|tahin|dattel|kokos(?!milch)/],
  ['Kühlregal',/milch|drink|joghurt|jogurt|sahne|schmand|quark|käse|feta|gouda|parmesan|mozzarella|gorgonzola|butter|margarine|\bei(er)?\b|eigelb|tofu|tempeh|cuisine|likemeat|chicken|schinken|hummus|gnocchi|frische hefe|hefe(?!flocken)|udon/],
  ['Nudeln, Reis & Getreide',/nudel|spaghetti|pasta|orzo|\breis\b|naturreis|quinoa|bulgur|couscous|buchweizen(?!mehl)|gerste|hafer|kleie|grieß|linsen|getrocknete kichererbsen|cornflakes|panko/],
  ['Konserven & Gläser',/dose|glas\b|passiert|tomatenmark|kokosmilch|\bmais\b|bohnen|brühe|fond|gewürzgurke|jalape|getrocknete tomaten|apfelmark|marmelade|kichererbsen|reispapier|hefeflocken/],
  ['Backen & Süßes',/mehl|zucker(?!schote)|backpulver|natron|vanille|kakao|schoko|kuvert|stärke|sirup|agaven|honig|aquafaba|semmelbrösel/],
  ['Brot & Backwaren',/brot|brötchen|wrap|tortilla/],
  ['Gewürze, Öl & Saucen',/salz|pfeffer|pulver|gewürz|zimt|muskat|kurkuma|kümmel|cumin|oregano|thymian|rosmarin|lorbeer|piment|wacholder|beifu|kardamom|galgant|bockshorn|koriandersamen|chiliflocken|senf|sojas|soße|sauce|sriracha|sambal|currypaste|ketchup|miso|marmite|gemahlen|getrocknet|kala namak/],
  ['Obst & Gemüse',/zwiebel|knoblauch|karott|möhre|paprika|zucchini|aubergine|tomate|gurke|salat|spinat|pilz|champignon|shiitake|brokkoli|kohl|kürbis|kartoffel|pastinake|sellerie|lauch|schalotte|ingwer|chili|avocado|zitrone|limette|banane|apfel|beere|obst|früchte|granatapfel|zwetschge|bete|radieschen|pak choi|mango|petersilie|koriander|basilikum|dill|schnittlauch|zitronengras|kräuter|rucola|romana|erbsen/]
];
function autoSec(it){
  const n=String(it.text!=null?it.text:it.name).toLowerCase();
  for(let i=0;i<SEC_RULES.length;i++){
    // Kleine Löffelmengen ohne eindeutigen Treffer sind meist Gewürze
    if(SEC_RULES[i][0]==='Obst & Gemüse' && ['TL','Prise','Msp.'].includes(it.u) && !/ingwer|chili|knoblauch/.test(n)) return 'Gewürze, Öl & Saucen';
    if(SEC_RULES[i][1].test(n)) return SEC_RULES[i][0];
  }
  return 'Sonstiges';
}
function secOf(it){ return it.sec && SECS.includes(it.sec) ? it.sec : autoSec(it); }
function col(){ return db.collection('listen').doc(listId).collection('eintraege'); }
// Änderungen speichern: immer auf dem Gerät, bei gemeinsamer Liste zusätzlich in Firebase
function commit(changed,removed){
  saveLocal();
  if(listId && db){
    const c=col(), b=db.batch();
    (changed||[]).forEach(it=>b.set(c.doc(it.id),plain(it)));
    (removed||[]).forEach(it=>b.delete(c.doc(it.id)));
    b.commit().catch(err=>{ console.warn(err); toast('Speichern in der gemeinsamen Liste hat nicht geklappt.'); });
  }
}

/* Firebase nur laden, wenn eine gemeinsame Liste benutzt wird */
const FBV='10.14.1';
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('Laden fehlgeschlagen')); document.head.appendChild(s); }); }
let fbReady=null;
function initFirebase(){
  if(fbReady) return fbReady;
  fbReady=(async()=>{
    const base='https://www.gstatic.com/firebasejs/'+FBV+'/';
    await loadScript(base+'firebase-app-compat.js');
    await loadScript(base+'firebase-auth-compat.js');
    await loadScript(base+'firebase-firestore-compat.js');
    if(!firebase.apps.length) firebase.initializeApp(FB);
    const d=firebase.firestore();
    try{ await d.enablePersistence({synchronizeTabs:true}); }catch(e){}
    const user=await new Promise(res=>{ const off=firebase.auth().onAuthStateChanged(u=>{ off(); res(u); }); });
    if(!user) await firebase.auth().signInAnonymously();
    db=d; return d;
  })();
  fbReady.catch(()=>{ fbReady=null; });
  return fbReady;
}
async function connect(id,uploadLocal){
  listId=id; try{ localStorage.setItem(LK,id); }catch(e){}
  sync={state:'connecting'}; refresh();
  try{ await initFirebase(); }
  catch(e){ sync={state:'error',msg:'Keine Verbindung zu Firebase.'}; refresh(); return; }
  if(listId!==id) return;
  if(uploadLocal && shop.items.length) commit(shop.items,[]);
  if(unsub) unsub();
  unsub=col().onSnapshot({includeMetadataChanges:true}, snap=>{
    shop.items=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((a,b)=>(a.t||0)-(b.t||0));
    sync={state: snap.metadata.fromCache ? 'offline' : 'online', pending: snap.metadata.hasPendingWrites};
    saveLocal(); refresh();
  }, err=>{ sync={state:'error',msg:(err&&err.code)||'Fehler'}; refresh(); });
}
function disconnect(){
  if(unsub) unsub(); unsub=null; listId=null;
  try{ localStorage.removeItem(LK); }catch(e){}
  sync={state:'local'}; saveLocal(); refresh();
}
function refresh(){
  updateCartCount();
  if(!$('#shop').hidden && editId==null) renderShop();
  if(!$('#detail').hidden && cur) renderCartBtn();
}
function parseListId(v){ const m=String(v).match(/liste=([a-z0-9]{20,})/) || String(v).trim().match(/^([a-z0-9]{20,})$/); return m?m[1]:null; }
function listLink(){ return location.origin+location.pathname+'?liste='+listId+'#einkauf'; }
async function shareLink(){
  const url=listLink(), text='Unsere gemeinsame Einkaufsliste:';
  if(navigator.share){ try{ await navigator.share({title:'Einkaufsliste',text:text,url:url}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(url); toast('Link kopiert. Jetzt z. B. in WhatsApp einfügen.'); }
  catch(e){ shareFallback=url; renderShop(); toast('Link unten markieren und kopieren.'); }
}
// Einladungslink aus der Adresse übernehmen (…?liste=abc#einkauf)
let pendingJoin=null;
if(FB){ const id=parseListId(location.search); if(id){ pendingJoin=id; history.replaceState(null,'',location.pathname+'#einkauf'); } }

// Grundzutaten, die man meistens zu Hause hat
function isBasic(name){
  const s=name.toLowerCase().replace(/\(.*?\)/g,'').trim();
  if(!s) return true;
  if(/^(\S+ )?(salz|pfeffer|wasser|öl)( zum braten| zum backen)?$/.test(s)) return true;
  if(/zum braten|für die form/.test(s) && /öl|fett/.test(s)) return true;
  return false;
}
function sumText(it){
  if(it.parts.some(p=>p.a)) return it.parts.map(p=>p.a||(p.n!=null?num(p.n,it.u)+(it.u?' '+it.u:''):'')).filter(Boolean).join(' + ');
  if(it.parts.every(p=>p.n==null)) return '';
  const s=it.parts.reduce((a,p)=>a+p.n,0); return num(s,it.u)+(it.u?' '+it.u:'');
}
function itemText(it){ if(it.text!=null) return it.text; const a=sumText(it); return (a?a+' ':'')+it.name; }
function addPart(name,u,n,a,r){
  const key=name.toLowerCase()+'|'+u;
  const plainAmt = n==null && !a;
  const hit=shop.items.find(i=>!i.done && i.text==null && (i.name.toLowerCase()+'|'+i.u)===key &&
    (n!=null ? i.parts.every(p=>p.n!=null) : plainAmt && i.parts.every(p=>p.n==null && !p.a)));
  const part={rid:r.id,rt:r.title,n:n,a:a};
  if(hit){ hit.parts.push(part); return hit; }
  const it={id:newId(),t:stamp(),name:name,u:u,parts:[part],done:false}; shop.items.push(it); return it;
}
function addRecipe(r,f,sel){
  let k=0,n=0; const changed=new Set();
  r.groups.forEach(g=>g.items.forEach(it=>{
    const idx=k++; if(!sel.has(idx)) return;
    const names = it.m==null ? it.t.split(',').map(s=>s.trim()) : [it.t.split(',')[0].trim()];
    names.forEach(name=>{
      name=name.replace(/\s*\((\d+ )?(kleine |große )?Dose[^)]*\)/i,'').trim();
      if(isBasic(name)) return;
      const u=it.u||''; let v=null,a='';
      if(it.m!=null){ if(Array.isArray(it.m)) a=qty(it,f).replace(/^ca\. /,''); else v=it.m*f; }
      changed.add(addPart(name,u,v,a,r)); n++;
    });
  }));
  if(n) commit([...changed],[]);
  return n;
}
let editId=null, confirmClear=false, shareFallback='';
function syncLine(){
  if(!listId) return '';
  const t={connecting:'Verbinde …', online:'Verbunden. Änderungen sehen alle sofort.',
    offline:'Offline. Änderungen werden abgeglichen, sobald wieder Internet da ist.',
    error:'Verbindung fehlgeschlagen'+(sync.msg?' ('+sync.msg+')':'')+'. Die Liste zeigt den zuletzt gespeicherten Stand.'}[sync.state]||'';
  return '<p class="syncline s-'+sync.state+'"><span class="sdot"></span>👥 Gemeinsame Liste · '+esc(t)+'</p>';
}
function shareBox(){
  if(!FB) return '';
  if(listId) return '<div class="sharebox"><h2 class="lbl">Gemeinsame Liste</h2>'+
    '<p>Alle, die den Link geöffnet haben, sehen und bearbeiten dieselbe Liste.</p>'+
    '<div class="sactions" style="margin-top:8px"><button class="btn" type="button" data-act="sharelink">Link an andere schicken</button>'+
    '<button class="btn" type="button" data-act="leave">Auf diesem Gerät trennen</button></div></div>';
  return '<div class="sharebox"><h2 class="lbl">Gemeinsam nutzen</h2>'+
    '<p>Teile die Liste mit anderen. Abhaken und Ergänzen sehen dann alle sofort.</p>'+
    '<button class="btn" type="button" data-act="startshare">👥 Liste gemeinsam nutzen</button>'+
    '<details><summary>Du hast einen Link bekommen?</summary>'+
    '<p class="small">Füge ihn hier ein. Auf dem iPhone ist das der sichere Weg, wenn die Rezepte als App auf dem Home-Bildschirm liegen.</p>'+
    '<form class="addform" id="joinform"><input id="joinIn" placeholder="Link hier einfügen" autocomplete="off" aria-label="Link zur gemeinsamen Liste"><button type="submit">Beitreten</button></form></details></div>';
}
function renderShop(){
  const open=shop.items.filter(i=>!i.done), done=shop.items.filter(i=>i.done);
  const recs=new Map(); shop.items.forEach(i=>i.parts.forEach(p=>recs.set(p.rid,p.rt)));
  const row=i=>{
    if(i.id===editId) return '<li class="editing" data-id="'+esc(i.id)+'"><div class="editbox"><input class="edit-in" id="editIn" value="'+esc(itemText(i))+'" aria-label="Eintrag bearbeiten">'+
      '<select class="edit-in" id="editSec" aria-label="Bereich im Supermarkt">'+SECS.map(x=>'<option'+(x===secOf(i)?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div>'+
      '<button class="ic" type="button" data-act="save" aria-label="Speichern">✓</button></li>';
    const a=i.text==null?sumText(i):'';
    const txt=i.text!=null?esc(i.text):(a?'<b>'+esc(a)+'</b> ':'')+esc(i.name);
    const from=[...new Set(i.parts.map(p=>p.rt))];
    return '<li class="'+(i.done?'done':'')+'" data-id="'+esc(i.id)+'">'+
      '<button class="chk" type="button" data-act="toggle" aria-label="'+(i.done?'Wieder offen':'Abhaken')+'"></button>'+
      '<button class="it" type="button" data-act="toggle"><span class="txt">'+txt+'</span>'+(from.length?'<small>für '+from.map(esc).join(', ')+'</small>':'')+'</button>'+
      '<button class="ic" type="button" data-act="edit" aria-label="Bearbeiten">✎</button>'+
      '<button class="ic" type="button" data-act="del" aria-label="Löschen">✕</button></li>';
  };
  $('#shop').innerHTML=
    '<div class="bar"><button class="back" type="button" data-act="back">‹ Rezepte</button>'+
    '<button class="btn" type="button" data-act="share"'+(open.length?'':' disabled')+'>Als Text teilen</button></div>'+
    '<div class="sheet"><h1 class="stitle">Einkaufsliste</h1>'+
    '<p class="sstat">'+(shop.items.length? open.length+' offen'+(done.length?' · '+done.length+' erledigt':'') : 'Noch leer.')+'</p>'+
    syncLine()+
    '<form class="addform" id="addform"><input id="addIn" placeholder="Hinzufügen, z. B. 2 l Milch" autocomplete="off" aria-label="Eintrag hinzufügen"><button type="submit">+</button></form>'+
    (recs.size?'<div class="lbl">Rezepte auf der Liste</div><div class="chips" style="margin-top:6px">'+[...recs].map(([id,t])=>'<span class="chip"><span class="cht">'+esc(t)+'</span><button type="button" data-act="rmrec" data-rid="'+esc(id)+'" aria-label="'+esc(t)+' von der Liste nehmen">✕</button></span>').join('')+'</div>':'')+
    (open.length?SECS.map(sec=>{ const its=open.filter(i=>secOf(i)===sec); return its.length?'<h2 class="lbl dhead">'+esc(sec)+'</h2><ul class="shop">'+its.map(row).join('')+'</ul>':''; }).join(''):
      '<p class="sempty">'+(done.length?'Alles erledigt. ':'')+'Öffne ein Rezept und tippe auf „Zur Einkaufsliste“, oder schreib oben selbst etwas dazu.</p>')+
    (done.length?'<h2 class="lbl dhead">Erledigt</h2><ul class="shop">'+done.map(row).join('')+'</ul>':'')+
    (shop.items.length?'<div class="sactions">'+
      (done.length?'<button class="btn" type="button" data-act="cleardone">Erledigte entfernen</button>':'')+
      (confirmClear?'<span>'+(listId?'Wirklich alles löschen, für alle?':'Wirklich alles löschen?')+'</span><button class="btn warn" type="button" data-act="clearyes">Ja, leeren</button><button class="btn" type="button" data-act="clearno">Abbrechen</button>'
                   :'<button class="btn warn" type="button" data-act="clear">Liste leeren</button>')+'</div>':'')+
    (shareFallback?'<textarea id="sharetxt" readonly aria-label="Zum Kopieren">'+esc(shareFallback)+'</textarea>':'')+
    shareBox()+
    '</div>';
  if(editId!=null){ const e=$('#editIn'); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } }
  if(shareFallback){ const ta=$('#sharetxt'); ta.focus(); ta.select(); }
}
function finishEdit(){
  const e=$('#editIn'), se=$('#editSec'); const it=shop.items.find(i=>i.id===editId); editId=null;
  if(e && it){ const v=e.value.trim(); let ch=false;
    if(!v){ shop.items=shop.items.filter(i=>i!==it); commit([],[it]); renderShop(); return; }
    if(v!==itemText(it)){ it.text=v; ch=true; }
    if(se && se.value!==secOf(it)){ it.sec=se.value; ch=true; }
    if(ch) commit([it],[]); }
  renderShop();
}
function shareText(){ const open=shop.items.filter(i=>!i.done);
  return 'Einkaufsliste'+SECS.map(sec=>{ const its=open.filter(i=>secOf(i)===sec); return its.length?'\n\n'+sec+'\n'+its.map(i=>'• '+itemText(i)).join('\n'):''; }).join(''); }
async function share(){
  const txt=shareText();
  if(navigator.share){ try{ await navigator.share({title:'Einkaufsliste',text:txt}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(txt); toast('Liste kopiert. Du kannst sie jetzt z. B. in WhatsApp einfügen.'); }
  catch(e){ shareFallback=txt; renderShop(); toast('Text unten markieren und kopieren.'); }
}
$('#shop').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, li=b.closest('li'), it=li&&shop.items.find(i=>i.id===li.dataset.id);
  if(act==='back'){ goBack(); return; }
  if(act==='share'){ share(); return; }
  if(act==='sharelink'){ shareLink(); return; }
  if(act==='save'){ finishEdit(); return; }
  if(act==='startshare'){ connect(randomListId(),true); toast('Gemeinsame Liste angelegt. Schick jetzt den Link an andere.'); }
  else if(act==='leave'){ disconnect(); toast('Getrennt. Die Liste bleibt auf diesem Gerät, wird aber nicht mehr abgeglichen.'); }
  else if(act==='toggle'&&it){ it.done=!it.done; commit([it],[]); }
  else if(act==='edit'&&it){ editId=it.id; }
  else if(act==='del'&&it){ shop.items=shop.items.filter(i=>i!==it); commit([],[it]); toast('„'+itemText(it)+'“ gelöscht.'); }
  else if(act==='rmrec'){ const rid=b.dataset.rid, ch=[], rm=[];
    shop.items.forEach(i=>{ if(i.parts.some(p=>p.rid===rid)){ i.parts=i.parts.filter(p=>p.rid!==rid); (i.parts.length||i.custom?ch:rm).push(i); } });
    shop.items=shop.items.filter(i=>!rm.includes(i)); commit(ch,rm); }
  else if(act==='cleardone'){ const rm=shop.items.filter(i=>i.done); shop.items=shop.items.filter(i=>!i.done); commit([],rm); }
  else if(act==='clear'){ confirmClear=true; }
  else if(act==='clearno'){ confirmClear=false; }
  else if(act==='clearyes'){ const rm=shop.items; shop.items=[]; confirmClear=false; commit([],rm); }
  shareFallback='';
  renderShop();
});
$('#shop').addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='joinform'){
    const id=parseListId($('#joinIn').value);
    if(!id){ toast('Das sieht nicht nach einem Listen-Link aus. Bitte den ganzen Link einfügen.'); return; }
    connect(id,true); toast('Mit der gemeinsamen Liste verbunden.'); return;
  }
  const v=$('#addIn').value.trim(); if(!v) return;
  const it={id:newId(),t:stamp(),name:v,u:'',parts:[],done:false,custom:true,text:v};
  shop.items.push(it); commit([it],[]); renderShop(); $('#addIn').focus();
});
$('#shop').addEventListener('keydown',e=>{
  if(e.target.id!=='editIn') return;
  if(e.key==='Enter'){ e.preventDefault(); finishEdit(); }
  if(e.key==='Escape'){ editId=null; renderShop(); }
});
$('#shop').addEventListener('focusout',e=>{ if((e.target.id==='editIn'||e.target.id==='editSec') && editId!=null) setTimeout(()=>{ const a=(document.activeElement||{}).id; if(editId!=null && a!=='editIn' && a!=='editSec') finishEdit(); },0); });

let toastT=null;
function toast(msg,link){
  const t=$('#toast'); t.innerHTML='<span>'+esc(msg)+'</span>'+(link?'<a href="'+link+'">Zur Liste</a>':''); t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500);
}
$('#toast').addEventListener('click',e=>{ if(e.target.closest('a')) $('#toast').hidden=true; });

/* ---------- Navigation ---------- */
// Merkt sich den Weg innerhalb der App, damit „Zurück“ nie aus der App hinausführt
const trail=[location.hash];
function goBack(){ if(trail.length>1) history.back(); else location.hash=''; }
function updateNav(){
  const v = !$('#shop').hidden ? 'einkauf' : (!$('#home').hidden && cat===FAV ? 'favoriten' : 'rezepte');
  document.querySelectorAll('.bnav button').forEach(b=>{ if(b.dataset.nav===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
}
document.querySelector('.bnav').addEventListener('click',e=>{
  const b=e.target.closest('[data-nav]'); if(!b) return; const v=b.dataset.nav;
  if(!$('#cook').hidden) closeCook();
  if(v==='einkauf'){ if(location.hash!=='#einkauf') location.hash='einkauf'; return; }
  const want = v==='favoriten' ? FAV : (cat===FAV ? 'Alle' : cat);
  const onHome = !location.hash || location.hash==='#';
  if(want!==cat || v==='rezepte') setCat(want);
  if(onHome){ route(); window.scrollTo(0,0); } else location.hash='';
});
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  $('#toast').hidden=true;
  if(!$('#cook').hidden) closeCook();
  const r=R.find(x=>x.id===id);
  $('#home').hidden=$('#detail').hidden=$('#shop').hidden=true;
  if(id==='einkauf'){ cur=null; editId=null; confirmClear=false; shareFallback=''; renderShop(); $('#shop').hidden=false; window.scrollTo(0,0); }
  else if(r){ renderDetail(r); $('#detail').hidden=false; window.scrollTo(0,0); }
  else { cur=null; renderTabs(); renderList(); $('#home').hidden=false; }
  updateCartCount(); updateNav();
}
window.addEventListener('hashchange',()=>{
  const h=location.hash;
  if(trail.length>1 && trail[trail.length-2]===h) trail.pop(); else trail.push(h);
  if(!h || h==='#') trail.length=1, trail[0]=h;
  route();
});
window.addEventListener('storage',e=>{ if(e.key===SK && !listId){ try{ shop=JSON.parse(e.newValue)||shop; }catch(_){} route(); } });
renderTabs(); renderList(); route();
if(FB){
  if(pendingJoin && pendingJoin!==listId){ const fresh=!listId; connect(pendingJoin,fresh); toast('Mit der gemeinsamen Liste verbunden.'); }
  else if(listId) connect(listId,false);
}
})();
